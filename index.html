/* =========================

window.signup=async function(){

 const name=document.getElementById("name").value.trim();
 const username=document.getElementById("username").value.trim().toLowerCase();
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 const err=document.getElementById("err");

 if(!name||!username||!email||!password){
   err.textContent="सभी details भरें";
   return;
 }

 if(password.length<6){
   err.textContent="Password कम से कम 6 characters का होना चाहिए";
   return;
 }

 try{

   const result=
   await createUserWithEmailAndPassword(auth,email,password);

   const u=result.user;

   await updateProfile(u,{
     displayName:name
   });

   await set(ref(db,"profiles/"+u.uid),{
     uid:u.uid,
     name:name,
     username:username,
     email:email,
     phone:"",
     photo:"",
     bio:"",
     followers:{},
     following:{},
     createdAt:Date.now()
   });

   err.innerHTML=
   '<div class="success">✅ Account बन गया</div>';

 }catch(e){

   console.error(e);
   err.textContent="❌ "+(e.code||e.message);

 }

};

/* =========================
   GOOGLE LOGIN
========================= */

window.googleLogin=async function(){

 try{

   const provider=new GoogleAuthProvider();

   const result=
   await signInWithPopup(auth,provider);

   const u=result.user;

   const profileRef=ref(db,"profiles/"+u.uid);
   const snap=await get(profileRef);

   if(!snap.exists()){

     let username=
       (u.displayName||"user")
       .toLowerCase()
       .replace(/[^a-z0-9]/g,"")
       .slice(0,12);

     username=username||("user"+String(u.uid).slice(0,6));

     await set(profileRef,{
       uid:u.uid,
       name:u.displayName||"Rechod User",
       username:username,
       email:u.email||"",
       phone:"",
       photo:u.photoURL||"",
       bio:"",
       followers:{},
       following:{},
       createdAt:Date.now()
     });

   }

 }catch(e){

   console.error(e);
   alert("Google Login Error:\n"+(e.code||e.message));

 }

};


/* =========================
   PHONE OTP
========================= */

window.sendOTP=async function(){

 const country=
 document.getElementById("countryCode").value;

 let number=
 document.getElementById("phone").value.trim();

 number=number.replace(/\D/g,"");

 if(!number){

   alert("Phone number डालें");
   return;

 }

 /*
   अगर user 0 से number शुरू करता है,
   तो शुरुआत का 0 हटाया जाएगा।
 */

 number=number.replace(/^0+/,"");

 const phone=country+number;

 try{

   if(recaptchaVerifier){

     try{
       recaptchaVerifier.clear();
     }catch(e){}

     recaptchaVerifier=null;

   }

   recaptchaVerifier=
   new RecaptchaVerifier(
     auth,
     "recaptcha-container",
     {
       size:"normal"
     }
   );

   await recaptchaVerifier.render();

   phoneConfirmation=
   await signInWithPhoneNumber(
     auth,
     phone,
     recaptchaVerifier
   );

   document
   .getElementById("otpArea")
   .classList.remove("hidden");

   alert(
     "✅ OTP भेज दिया गया\n\nNumber: "+phone
   );

 }catch(e){

   console.error(e);

   alert(
     "❌ OTP नहीं भेजा गया:\n"+
     (e.code||e.message)
   );

   if(recaptchaVerifier){

     try{
       recaptchaVerifier.clear();
     }catch(x){}

     recaptchaVerifier=null;

   }

 }

};


/* =========================
   VERIFY OTP
========================= */

window.verifyOTP=async function(){

 const otp=
 document.getElementById("otp").value.trim();

 const errBox=
 document.getElementById("err");

 if(!phoneConfirmation){

   errBox.textContent="पहले Send OTP दबाएँ";
   return;

 }

 if(!/^\d{6}$/.test(otp)){

   errBox.textContent="6 digit OTP डालें";
   return;

 }

 try{

   const result=
   await phoneConfirmation.confirm(otp);

   const u=result.user;

   const profileRef=
   ref(db,"profiles/"+u.uid);

   const snap=
   await get(profileRef);

   if(!snap.exists()){

     let username=
     "user"+String(u.uid).slice(0,6);

     await set(profileRef,{
       uid:u.uid,
       name:"Rechod User",
       username:username,
       email:u.email||"",
       phone:u.phoneNumber||"",
       photo:"",
       bio:"",
       followers:{},
       following:{},
       createdAt:Date.now()
     });

   }

   phoneConfirmation=null;

   if(recaptchaVerifier){

     try{
       recaptchaVerifier.clear();
     }catch(e){}

     recaptchaVerifier=null;

   }

   errBox.innerHTML=
   '<div class="success">✅ Phone login successful</div>';

 }catch(e){

   console.error(e);

   if(e.code==="auth/invalid-verification-code"){

     errBox.textContent="❌ OTP गलत है";

   }else if(e.code==="auth/code-expired"){

     errBox.textContent=
     "❌ OTP expire हो गया। नया OTP भेजें";

   }else{

     errBox.textContent=
     "❌ OTP verification error: "+
     (e.code||e.message);

   }

 }

};

/* =========================
   CLOUDINARY UPLOAD
========================= */

async function cloudinaryUpload(file,resourceType="auto"){

 const fd=new FormData();

 fd.append("file",file);
 fd.append("upload_preset",UPLOAD_PRESET);

 const endpoint=
 `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`;

 const res=
 await fetch(endpoint,{
   method:"POST",
   body:fd
 });

 const data=await res.json();

 if(!res.ok||!data.secure_url){

   throw new Error(
     data.error?.message||
     "Cloudinary upload failed"
   );

 }

 return data.secure_url;

}

/* =========================
   NOTIFICATIONS
========================= */

function notificationsPage(){

 let html=`
 <div class="page">

 <h2>🔔 Notifications</h2>
 `;

 const arr=
 Object.values(notifs)
 .sort((a,b)=>
   (b.createdAt||0)-(a.createdAt||0)
 );

 if(!arr.length){

   html+=`
   <div class="card">
    कोई notification नहीं है।
   </div>
   `;

 }

 arr.forEach(n=>{

   const p=profiles[n.sender]||{};

   html+=`
   <div class="notif">

    <b>
     ${escapeHTML(p.username||"user")}
    </b>

    ${escapeHTML(n.text||"")}

    <br>

    <small>
     ${timeAgo(n.createdAt)}
    </small>

   </div>
   `;

 });

 html+=`</div>`;

 return html;

}

window.viewStory=function(id){

 const s=stories[id];

 if(!s)return;

 currentStoryId=id;

 const p=profiles[s.uid]||{};

 const content=
 s.type==="video"
 ?
 `<video
    class="preview"
    controls
    autoplay
    playsinline
    src="${s.url}">
  </video>`
 :
 `<img
    class="preview"
    style="filter:${filters[s.filter]||"none"}"
    src="${s.url}">
 `;

 document.getElementById("app").innerHTML=`

 <div class="page">

  <button
   class="secondary"
   onclick="page('home')">
   ← Back
  </button>

  <div class="card">

   <div class="userline">

    <img
     class="avatar"
     src="${p.photo||avatar(s.uid)}">

    <b>
     @${escapeHTML(p.username||"user")}
    </b>

   </div>

   ${content}

   <div class="actions">

    <button
     class="action"
     onclick="likeStory('${id}')">
     ❤️ ${Object.keys(s.likes||{}).length}
    </button>

    <span>
     👁️ ${Object.keys(s.views||{}).length}
    </span>

   </div>

  </div>

 </div>

 `;

 set(
   ref(db,`stories/${id}/views/${me.uid}`),
   true
 );

};

window.likeStory=async function(id){

 );

/* =========================
   HELPERS
========================= */

function avatar(uid){

 return "https://ui-avatars.com/api/?name="+
 encodeURIComponent(
   profiles[uid]?.name||
   profiles[uid]?.username||
   "User"
 );

}


function timeAgo(t){

 if(!t)return "";

 const sec=
 Math.floor((Date.now()-t)/1000);

 if(sec<60)return "अभी";

 const min=Math.floor(sec/60);

 if(min<60)return min+" min";

 const hr=Math.floor(min/60);

 if(hr<24)return hr+" घंटे";

 const day=Math.floor(hr/24);

 return day+" दिन";

}


function escapeHTML(str){

 return String(str||"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


/* =========================
   AUTO CLEAN OLD STORIES
========================= */

setInterval(async()=>{

 if(!me)return;

 Object.entries(stories).forEach(
 async([id,s])=>{

   if(
     s.createdAt &&
     Date.now()-s.createdAt>86400000
   ){

     try{

       await remove(
         ref(db,"stories/"+id)
       );

     }catch(e){}

   }

 });

},60000);
