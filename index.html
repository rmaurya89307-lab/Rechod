<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Rechod</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%}
body{
  font-family:Arial,sans-serif;
  background:#eef2f7;
  color:#172033;
}
body.dark{
  background:#10141c;
  color:#fff;
}
button,input,textarea,select{
  font:inherit;
}
button{
  cursor:pointer;
}
.hidden{display:none!important}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  position:relative;
}
body.dark .app{background:#10141c}

.header{
  height:58px;
  position:fixed;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  background:#fff;
  border-bottom:1px solid #ddd;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
}
body.dark .header{
  background:#11151d;
  border-color:#303640;
}
.logo{
  font-size:25px;
  font-weight:900;
  color:#1877f2;
}
.header-actions{
  display:flex;
  gap:8px;
}
.icon-btn{
  border:0;
  background:transparent;
  font-size:23px;
  color:inherit;
  width:40px;
  height:40px;
  border-radius:50%;
}
.icon-btn:active{background:#eee}

.main{
  padding-top:58px;
  padding-bottom:65px;
  min-height:100vh;
}

.page{
  display:none;
}
.page.active{
  display:block;
}

/* ---------- AUTH ---------- */

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#1877f2,#6c2cff);
}
.auth-card{
  width:100%;
  max-width:400px;
  background:#fff;
  padding:25px;
  border-radius:22px;
  box-shadow:0 15px 45px #0004;
}
.auth-logo{
  text-align:center;
  font-size:36px;
  font-weight:900;
  color:#1877f2;
  margin-bottom:20px;
}
.field{
  width:100%;
  border:1px solid #ddd;
  border-radius:12px;
  padding:13px;
  margin:7px 0;
  outline:none;
}
.field:focus{
  border-color:#1877f2;
}
.primary{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  background:#1877f2;
  color:white;
  font-weight:bold;
  margin-top:8px;
}
.google{
  width:100%;
  border:1px solid #ddd;
  background:white;
  border-radius:12px;
  padding:12px;
  margin-top:8px;
}
.auth-switch{
  text-align:center;
  margin-top:15px;
  color:#1877f2;
  cursor:pointer;
}

/* ---------- STORIES ---------- */

.stories{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:12px;
  border-bottom:1px solid #ddd;
}
.story{
  min-width:70px;
  text-align:center;
  font-size:11px;
}
.story-avatar{
  width:62px;
  height:62px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #1877f2;
  padding:2px;
}
.add-story{
  width:62px;
  height:62px;
  border-radius:50%;
  background:#1877f2;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

/* ---------- POSTS ---------- */

.post{
  background:#fff;
  border-bottom:8px solid #eef2f7;
}
body.dark .post{
  background:#10141c;
  border-color:#181e28;
}
.post-head{
  display:flex;
  align-items:center;
  padding:10px;
}
.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}
.user-info{
  flex:1;
  margin-left:9px;
}
.username{
  font-weight:bold;
}
.post-time{
  color:#777;
  font-size:11px;
}
.follow-small{
  border:1px solid #1877f2;
  color:#1877f2;
  background:transparent;
  border-radius:8px;
  padding:6px 10px;
}
.post-media{
  width:100%;
  display:block;
  max-height:620px;
  object-fit:cover;
}
.post-actions{
  display:flex;
  gap:8px;
  padding:7px 10px;
}
.action{
  border:0;
  background:transparent;
  font-size:23px;
  color:inherit;
}
.save{
  margin-left:auto;
}
.post-body{
  padding:0 10px 12px;
}
.caption{
  margin-top:6px;
}
.count{
  font-size:13px;
  color:#777;
}

/* ---------- REELS ---------- */

.reels-page{
  background:#000;
  height:calc(100vh - 58px - 62px);
  min-height:500px;
  overflow-y:auto;
  overflow-x:hidden;

  /* REAL REEL SCROLL */
  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;
  overscroll-behavior:contain;
}

.reels-page::-webkit-scrollbar{
  width:0;
}

.reel{
  width:100%;
  height:calc(100vh - 58px - 62px);
  min-height:500px;
  position:relative;
  background:#000;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  overflow:hidden;
}

.reel-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

.reel-gradient{
  position:absolute;
  inset:0;
  background:
    linear-gradient(to top,#000b 0%,transparent 35%),
    linear-gradient(to bottom,#0005,transparent 25%);
  pointer-events:none;
}

.reel-top{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  z-index:5;
  color:white;
}

.reel-title{
  font-weight:bold;
  font-size:18px;
}

.reel-mute{
  width:40px;
  height:40px;
  border-radius:50%;
  border:0;
  background:#0008;
  color:white;
  font-size:20px;
}

.reel-side{
  position:absolute;
  right:8px;
  bottom:110px;
  z-index:6;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:17px;
  color:white;
}

.reel-side button{
  border:0;
  background:transparent;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:26px;
  text-shadow:0 1px 5px #000;
}

.reel-side span{
  font-size:12px;
  margin-top:-12px;
}

.reel-info{
  position:absolute;
  left:12px;
  right:75px;
  bottom:20px;
  z-index:6;
  color:white;
}

.reel-user{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}

.reel-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid white;
}

.reel-follow{
  border:1px solid white;
  background:transparent;
  color:white;
  border-radius:7px;
  padding:5px 12px;
  margin-left:6px;
}

.reel-caption{
  font-size:14px;
  line-height:1.4;
  margin-bottom:8px;
}

.reel-music{
  font-size:13px;
  display:flex;
  gap:5px;
  align-items:center;
}

.reel-progress{
  position:absolute;
  bottom:0;
  left:0;
  height:3px;
  width:100%;
  background:#ffffff55;
  z-index:8;
}

.reel-progress i{
  display:block;
  width:0;
  height:100%;
  background:#fff;
}

/* ---------- BOTTOM NAV ---------- */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  height:62px;
  background:#fff;
  border-top:1px solid #ddd;
  z-index:120;
  display:flex;
  justify-content:space-around;
  align-items:center;
}
body.dark .bottom-nav{
  background:#11151d;
  border-color:#303640;
}
.nav-btn{
  border:0;
  background:transparent;
  color:#555;
  font-size:24px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
body.dark .nav-btn{color:#aaa}
.nav-btn.active{color:#1877f2}
.nav-text{
  font-size:9px;
  margin-top:2px;
}

/* ---------- CREATE ---------- */

.create-card{
  padding:15px;
}
.preview{
  width:100%;
  max-height:450px;
  object-fit:contain;
  background:#111;
  border-radius:15px;
  margin-top:10px;
}
.filter-row{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:10px 0;
}
.filter-btn{
  white-space:nowrap;
  border:1px solid #ccc;
  border-radius:20px;
  background:#fff;
  padding:7px 11px;
}
.filter-btn.active{
  background:#1877f2;
  color:#fff;
}

/* ---------- PROFILE ---------- */

.profile-top{
  padding:18px 15px;
}
.profile-main{
  display:flex;
  align-items:center;
  gap:18px;
}
.profile-photo{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
}
.stats{
  flex:1;
  display:flex;
  justify-content:space-around;
  text-align:center;
}
.stat b{
  display:block;
  font-size:18px;
}
.stat small{color:#777}
.profile-name{
  margin-top:12px;
  font-weight:bold;
}
.profile-actions{
  display:flex;
  gap:7px;
  margin-top:12px;
}
.profile-actions button{
  flex:1;
  padding:9px;
  border-radius:9px;
  border:1px solid #ccc;
  background:transparent;
  color:inherit;
}
.profile-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
}
.grid-item{
  aspect-ratio:1;
  overflow:hidden;
  background:#ddd;
}
.grid-item img,
.grid-item video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ---------- SEARCH ---------- */

.search-box{
  padding:12px;
}
.search-results{
  padding:0 12px;
}
.person{
  display:flex;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #ddd;
}
.person-info{
  flex:1;
  margin-left:10px;
}

/* ---------- CHAT ---------- */

.chat-list{
  padding:10px;
}
.chat-user{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  border-bottom:1px solid #ddd;
}
.chat-box{
  position:fixed;
  inset:0;
  background:#fff;
  z-index:300;
  display:flex;
  flex-direction:column;
}
body.dark .chat-box{background:#10141c}
.chat-head{
  height:58px;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
}
.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:12px;
}
.msg{
  max-width:75%;
  padding:9px 12px;
  border-radius:15px;
  margin:5px 0;
}
.msg.mine{
  margin-left:auto;
  background:#1877f2;
  color:white;
}
.msg.theirs{
  background:#eee;
}
.chat-input{
  display:flex;
  padding:8px;
  border-top:1px solid #ddd;
  gap:5px;
}
.chat-input input{
  flex:1;
  border:1px solid #ccc;
  border-radius:20px;
  padding:10px;
}
.chat-input button{
  border:0;
  border-radius:50%;
  width:42px;
  background:#1877f2;
  color:white;
}

/* ---------- MODALS ---------- */

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:250;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.modal-card{
  width:min(520px,100%);
  max-height:90vh;
  overflow-y:auto;
  background:#fff;
  color:#172033;
  border-radius:22px 22px 0 0;
  padding:18px;
}
body.dark .modal-card{
  background:#171d27;
  color:#fff;
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.close{
  border:0;
  background:transparent;
  font-size:25px;
}
.comment{
  display:flex;
  gap:8px;
  margin:10px 0;
}
.comment img{
  width:32px;
  height:32px;
  border-radius:50%;
}
.comment-body{
  background:#eee;
  border-radius:12px;
  padding:7px 10px;
}
body.dark .comment-body{background:#252c37}

/* ---------- TOAST ---------- */

.toast{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  background:#111;
  color:#fff;
  padding:10px 16px;
  border-radius:20px;
  z-index:500;
  display:none;
}
.toast.show{display:block}

/* ---------- FILTERS ---------- */

.f-normal{filter:none}
.f-bright{filter:brightness(1.2)}
.f-vivid{filter:saturate(1.6) contrast(1.08)}
.f-vintage{filter:sepia(.35) contrast(.95)}
.f-warm{filter:sepia(.2) saturate(1.4)}
.f-cool{filter:hue-rotate(15deg) saturate(.9)}
.f-bw{filter:grayscale(1)}
.f-sunset{filter:sepia(.25) saturate(1.7) hue-rotate(-10deg)}
.f-cinematic{filter:contrast(1.25) saturate(1.15)}
.f-glow{filter:brightness(1.1) saturate(1.25)}
.f-pink{filter:hue-rotate(-20deg) saturate(1.25)}
.f-nature{filter:saturate(1.45) hue-rotate(5deg)}
.f-dramatic{filter:contrast(1.4) brightness(.92)}
.f-fade{filter:contrast(.85) brightness(1.08) saturate(.75)}
.f-dark{filter:brightness(.7) contrast(1.15)}

@media(max-width:380px){
  .reel-side{right:3px}
  .reel-info{right:65px}
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->

<div id="authScreen" class="auth">
  <div class="auth-card">

    <div class="auth-logo">Rechod</div>

    <div id="loginBox">

      <input id="loginEmail"
             class="field"
             placeholder="Email">

      <input id="loginPassword"
             class="field"
             type="password"
             placeholder="Password">

      <button class="primary" onclick="emailLogin()">
        Login
      </button>

      <button class="google" onclick="googleLogin()">
        🔵 Continue with Google
      </button>

      <hr>

      <input id="phone"
             class="field"
             placeholder="+91XXXXXXXXXX">

      <div id="recaptcha-container"></div>

      <button class="primary"
              onclick="sendOTP()">
        📱 Send OTP
      </button>

      <input id="otp"
             class="field hidden"
             placeholder="Enter OTP">

      <button id="verifyOtpBtn"
              class="primary hidden"
              onclick="verifyOTP()">
        Verify OTP
      </button>

      <div class="auth-switch"
           onclick="showSignup()">
        Create new account
      </div>
    </div>

    <div id="signupBox" class="hidden">

      <input id="signupUsername"
             class="field"
             placeholder="Username">

      <input id="signupEmail"
             class="field"
             placeholder="Email">

      <input id="signupPassword"
             class="field"
             type="password"
             placeholder="Password">

      <input id="signupAge"
             class="field"
             type="number"
             placeholder="Age">

      <button class="primary"
              onclick="signup()">
        Sign Up
      </button>

      <div class="auth-switch"
           onclick="showLogin()">
        Already have an account?
      </div>
    </div>

  </div>
</div>


<!-- ================= APP ================= -->

<div id="app" class="app hidden">

<header class="header">
  <div class="logo">Rechod</div>

  <div class="header-actions">
    <button class="icon-btn"
            onclick="openNotifications()">
      🔔
    </button>

    <button class="icon-btn"
            onclick="openMessages()">
      💬
    </button>
  </div>
</header>

<main class="main">

<!-- HOME -->

<section id="homePage" class="page active">

  <div id="stories" class="stories"></div>

  <div id="feed"></div>

</section>


<!-- REELS -->

<section id="reelsPage"
         class="page"
         style="padding:0;background:#000">

  <div id="reelsContainer"
       class="reels-page">
  </div>

</section>


<!-- SEARCH -->

<section id="searchPage" class="page">

  <div class="search-box">
    <input id="searchInput"
           class="field"
           placeholder="🔍 Search username..."
           oninput="searchUsers()">
  </div>

  <div id="searchResults"
       class="search-results">
  </div>

</section>


<!-- CREATE -->

<section id="createPage" class="page">

  <div class="create-card">

    <h2>Create</h2>

    <select id="createType"
            class="field"
            onchange="updateCreateType()">

      <option value="post">
        📷 Photo / Video Post
      </option>

      <option value="reel">
        🎬 Reel
      </option>

      <option value="story">
        ⭕ Story
      </option>

    </select>

    <input id="mediaFile"
           class="field"
           type="file"
           accept="image/*,video/*"
           onchange="previewMedia()">

    <img id="mediaPreview"
         class="preview hidden">

    <video id="videoPreview"
           class="preview hidden"
           controls
           playsinline>
    </video>

    <div id="filterArea">

      <b>Filters</b>

      <div class="filter-row">

        <button class="filter-btn"
                onclick="selectFilter('normal')">
          Normal
        </button>

        <button class="filter-btn"
                onclick="selectFilter('bright')">
          Bright
        </button>

        <button class="filter-btn"
                onclick="selectFilter('vivid')">
          Vivid
        </button>

        <button class="filter-btn"
                onclick="selectFilter('vintage')">
          Vintage
        </button>

        <button class="filter-btn"
                onclick="selectFilter('warm')">
          Warm
        </button>

        <button class="filter-btn"
                onclick="selectFilter('cool')">
          Cool
        </button>

        <button class="filter-btn"
                onclick="selectFilter('bw')">
          B&W
        </button>

        <button class="filter-btn"
                onclick="selectFilter('sunset')">
          Sunset
        </button>

        <button class="filter-btn"
                onclick="selectFilter('cinematic')">
          Cinematic
        </button>

        <button class="filter-btn"
                onclick="selectFilter('glow')">
          Glow
        </button>

        <button class="filter-btn"
                onclick="selectFilter('pink')">
          Pink
        </button>

        <button class="filter-btn"
                onclick="selectFilter('nature')">
          Nature
        </button>

        <button class="filter-btn"
                onclick="selectFilter('dramatic')">
          Dramatic
        </button>

        <button class="filter-btn"
                onclick="selectFilter('fade')">
          Fade
        </button>

        <button class="filter-btn"
                onclick="selectFilter('dark')">
          Dark
        </button>

      </div>

    </div>

    <input id="musicName"
           class="field"
           placeholder="🎵 Song / Music name">

    <textarea id="caption"
              class="field"
              rows="4"
              placeholder="Write caption... @mention #hashtag">
    </textarea>

    <button class="primary"
            onclick="uploadContent()">
      🚀 Publish
    </button>

  </div>

</section>


<!-- PROFILE -->

<section id="profilePage" class="page">

  <div class="profile-top">

    <div class="profile-main">

      <img id="profilePhoto"
           class="profile-photo"
           src="https://via.placeholder.com/100">

      <div class="stats">

        <div class="stat">
          <b id="profilePosts">0</b>
          <small>Posts</small>
        </div>

        <div class="stat">
          <b id="profileFollowers">0</b>
          <small>Followers</small>
        </div>

        <div class="stat">
          <b id="profileFollowing">0</b>
          <small>Following</small>
        </div>

      </div>

    </div>

    <div id="profileName"
         class="profile-name">
      User
    </div>

    <div class="profile-actions">

      <button onclick="editProfile()">
        Edit Profile
      </button>

      <button onclick="shareProfile()">
        Share Profile
      </button>

    </div>

  </div>

  <div id="profileGrid"
       class="profile-grid">
  </div>

</section>


<!-- SETTINGS -->

<section id="settingsPage" class="page">

  <div style="padding:15px">

    <h2>Settings</h2>

    <button class="field"
            onclick="toggleDarkMode()">
      🌙 Dark Mode
    </button>

    <button class="field"
            onclick="showPage('profilePage')">
      👤 Profile
    </button>

    <button class="field"
            onclick="logoutNow()">
      🚪 Logout
    </button>

  </div>

</section>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button class="nav-btn active"
          onclick="showPage('homePage',this)">
    🏠
    <span class="nav-text">Home</span>
  </button>

  <button class="nav-btn"
          onclick="showPage('searchPage',this)">
    🔍
    <span class="nav-text">Search</span>
  </button>

  <button class="nav-btn"
          onclick="showPage('createPage',this)">
    ➕
    <span class="nav-text">Create</span>
  </button>

  <button class="nav-btn"
          onclick="showPage('reelsPage',this)">
    ▶️
    <span class="nav-text">Reels</span>
  </button>

  <button class="nav-btn"
          onclick="showPage('profilePage',this)">
    👤
    <span class="nav-text">Profile</span>
  </button>

</nav>

</div>


<!-- ================= COMMENTS MODAL ================= -->

<div id="commentModal"
     class="modal hidden">

  <div class="modal-card">

    <div class="modal-head">
      <h3>Comments</h3>

      <button class="close"
              onclick="closeModal('commentModal')">

function timeAgo(ts){

  if(!ts)return "";

  const sec = Math.floor((Date.now()-ts)/1000);

  if(sec<60)return "now";

  const min = Math.floor(sec/60);

  if(min<60)return min+"m";

  const hour = Math.floor(min/60);

  if(hour<24)return hour+"h";

  const day = Math.floor(hour/24);

  return day+"d";
}

function normalizePhone(value){

  let v = value.trim();

  v = v.replace(/[\s\-()]/g,"");

  if(v.startsWith("0")){
    v = "+91"+v.substring(1);
  }

  if(/^[6-9]\d{9}$/.test(v)){
    v = "+91"+v;
  }

  return v;
}


window.sendOTP = async ()=>{

  try{

    const phone =
      normalizePhone($("phone").value);

    if(!/^\+[1-9]\d{7,14}$/.test(phone)){

      return;
    }

    if(window.recaptchaVerifier){
      try{
        window.recaptchaVerifier.clear();
      }catch(e){}
    }

    window.recaptchaVerifier =
      new RecaptchaVerifier(
        auth,
        "recaptcha-container",
        {
          size:"normal"
        }
      );

    await window.recaptchaVerifier.render();

    confirmationResult =
      await signInWithPhoneNumber(
        auth,
        phone,

      );

    $("otp").classList.remove("hidden");
    $("verifyOtpBtn").classList.remove("hidden");

    toast("OTP भेज दिया गया");

/* =========================================================
   CLOUDINARY
========================================================= */

async function uploadCloudinary(file){

  const type =
    file.type.startsWith("video")
      ? "video"
      : "image";

  const url =
    "https://api.cloudinary.com/v1_1/"+
    CLOUD_NAME+
    "/"+type+"/upload";

  const form = new FormData();

  form.append("file",file);
  form.append("upload_preset",UPLOAD_PRESET);

  const response =
    await fetch(url,{
      method:"POST",
      body:form
    });

  const data = await response.json();

  if(!response.ok || !data.secure_url){

    throw new Error(
      data.error?.message ||
      "Cloudinary upload failed"
    );

  }

  return data.secure_url;
}

/* =========================================================
   REAL REEL SCROLL + AUTO PLAY
========================================================= */

function setupReelObserver(){

  const container =
    $("reelsContainer");

  const reels =
    [...container.querySelectorAll(".reel")];

  const observer =
    new IntersectionObserver(
      entries=>{

        entries.forEach(entry=>{

          const reel =
            entry.target;

          const video =
            reel.querySelector("video");

          const progress =
            reel.querySelector(".reel-progress i");

          if(entry.isIntersecting &&
             entry.intersectionRatio>=0.65){

            reels.forEach(other=>{

              if(other!==reel){

                const v =
                  other.querySelector("video");

                v.pause();
                v.currentTime =
                  Math.min(v.currentTime,v.duration||v.currentTime);

              }

            });

            video.play().catch(()=>{});

            countReelView(
              reel.dataset.reelId
            );

            video.ontimeupdate=()=>{

              if(video.duration){

                progress.style.width =
                  (video.currentTime/
                   video.duration*100)+"%";

              }

            };

          }else{

            video.pause();

          }

        });

      },
      {
        root:container,
        threshold:[0.65]
      }
    );

  reels.forEach(reel=>{
    observer.observe(reel);
  });

}


let viewedReels={};

async function countReelView(id){

  if(viewedReels[id])return;

  viewedReels[id]=true;

  await runTransaction(
    ref(db,"reels/"+id+"/views"),
    n=>(Number(n)||0)+1
  );

}

/* =========================================================
   STORIES
========================================================= */

function loadStories(){

  onValue(
    ref(db,"stories"),
    snapshot=>{

      const now=Date.now();
      const stories=[];

      snapshot.forEach(child=>{

        const s={
          id:child.key,
          ...child.val()
        };

        if(
          s.expiresAt &&
          s.expiresAt>now
        ){

          stories.push(s);

        }

      });

      stories.sort(
        (a,b)=>
          (b.createdAt||0)-
          (a.createdAt||0)
      );

      let html=`
        <div class="story"
             onclick="showPage('createPage')">

          <div class="add-story">+</div>
          <div>Add Story</div>

        </div>`;

      html +=
        stories.map(s=>`

          <div class="story"
               onclick='viewStory(${JSON.stringify(s)})'>

            <img class="story-avatar"
                 src="${esc(
                   s.photo ||
                   "https://via.placeholder.com/100"
                 )}">

            <div>
              ${esc(s.username || "user")}
            </div>

          </div>

        `).join("");

      $("stories").innerHTML=html;

    }
  );

}


window.viewStory = story=>{

  const isVideo =
    story.mediaType==="video";

  const media =
    isVideo
      ?
      `<video src="${esc(story.media)}"
              style="width:100%;max-height:75vh"
              controls autoplay></video>`
      :
      `<img src="${esc(story.media)}"
            style="width:100%;max-height:75vh;object-fit:contain">`;

  const modal =
    document.createElement("div");

  modal.className="modal";

  modal.innerHTML=`
    <div class="modal-card"
         style="background:#000;color:#fff">

      <button class="close"
              style="color:white"
              onclick="this.closest('.modal').remove()">
        ×
      </button>

      ${media}

      <h3>@${esc(story.username)}</h3>

      <p>${esc(story.caption || "")}</p>

      <div>
        🎵 ${esc(story.music || "Original audio")}
      </div>

    </div>`;

  document.body.appendChild(modal);

};

window.searchUsers = async ()=>{

  const q =
    $("searchInput")
      .value
      .trim()
      .toLowerCase();

  if(!q){

    $("searchResults").innerHTML="";
    return;

  }

  const snap =
    await get(ref(db,"profiles"));

  const users=[];

  if(snap.exists()){

    snap.forEach(child=>{

      const p=child.val();

      if(
        String(p.username||"")
          .toLowerCase()
          .includes(q) ||
        String(p.name||"")
          .toLowerCase()
          .includes(q)
      ){

        users.push(p);

      }

    });

  }

  $("searchResults").innerHTML =
    users.map(p=>`

      <div class="person">

        <img class="avatar"
             src="${esc(
               p.photo ||
               "https://via.placeholder.com/100"

          <div>${esc(p.name||"")}</div>

        </div>

        <button class="follow-small"
                onclick="followUser('${esc(p.uid)}')">
          Follow

      </div>

    `).join("");

};

  $("profileFollowers").textContent =

    currentProfile.following||0;

  const postsSnap =
    await get(ref(db,"posts"));

  const reelsSnap =
    await get(ref(db,"reels"));

  const items=[];

  if(postsSnap.exists()){

    postsSnap.forEach(child=>{

      const p=child.val();

      if(p.uid===currentUser.uid){
        items.push(p);
      }

    });

  }

  if(reelsSnap.exists()){

    reelsSnap.forEach(child=>{

      const p=child.val();

      if(p.uid===currentUser.uid){
        items.push(p);
      }

    });

  }

  $("profilePosts").textContent =
    items.length;

  $("profileGrid").innerHTML =
    items.map(item=>{

      if(item.mediaType==="video"){

        return `
        <div class="grid-item">
          <video src="${esc(item.media)}"
                 muted
                 playsinline></video>
        </div>`;

      }

      return `
      <div class="grid-item">
        <img src="${esc(item.media)}">
      </div>`;

    }).join("");

}

window.openChat = user=>{

  document.querySelectorAll(".modal")
    .forEach(m=>m.remove());

  currentChatUid=user.uid;

  $("chatName").textContent =
    "@"+(user.username||"user");

  $("chatAvatar").src =
    user.photo ||
    "https://via.placeholder.com/100";

  $("chatBox")
    .classList.remove("hidden");

  loadMessages();

};


function conversationId(a,b){

  return [a,b].sort().join("_");

}


function loadMessages(){

  const id =
    conversationId(
      currentUser.uid,
      currentChatUid
    );

  onValue(
    ref(db,"messages/"+id),
    snapshot=>{

      const messages=[];

      snapshot.forEach(child=>{

        messages.push({
          id:child.key,
          ...child.val()
        });

      });

      messages.sort(
        (a,b)=>
          (a.timestamp||0)-
          (b.timestamp||0)
      );

      $("chatMessages").innerHTML =
        messages.map(m=>`

          <div class="msg ${
            m.senderUid===currentUser.uid
              ? "mine"
              : "theirs"
          }">
            ${esc(m.text)}
          </div>

        `).join("");

      const box =
        $("chatMessages");

      box.scrollTop =
        box.scrollHeight;

    }
  );

}


window.sendMessage = async ()=>{

  const text =
    $("chatText").value.trim();

  if(!text || !currentChatUid)return;

  const id =
    conversationId(
      currentUser.uid,
      currentChatUid
    );

  const msgRef =
    push(ref(db,"messages/"+id));

  await set(msgRef,{
    senderUid:currentUser.uid,
    receiverUid:currentChatUid,
    text:text,
    timestamp:Date.now()
  });

  $("chatText").value="";

};


window.closeChat = ()=>{

  $("chatBox")
    .classList.add("hidden");

};
