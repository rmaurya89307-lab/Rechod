<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1877f2">
<title>Rechod</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#eef2f7;
color:#172033
}
.wrap{
max-width:520px;
margin:auto;
min-height:100vh;
background:#fff
}
.top{
position:sticky;
top:0;
z-index:5;
background:#1877f2;
color:white;
padding:14px 16px;
font-size:24px;
font-weight:700;
display:flex;
justify-content:space-between
}
nav{
position:sticky;
bottom:0;
z-index:6;
display:flex;
background:#fff;
border-top:1px solid #ddd;
justify-content:space-around;
padding:8px 2px
}
nav button{
border:0;
background:none;
font-size:20px;
padding:5px
}
main{padding:12px}
.card{
background:#fff;
border:1px solid #ddd;
border-radius:12px;
padding:12px;
margin-bottom:12px;
box-shadow:0 1px 3px #0001
}
input,textarea,button{font:inherit}
input,textarea{
width:100%;
padding:11px;
border:1px solid #ccc;
border-radius:8px;
margin:5px 0
}
.btn{
background:#1877f2;
color:#fff;
border:0;
border-radius:8px;
padding:10px 14px;
margin:4px 2px
}
.danger{background:#d33}
.muted{
color:#667085;
font-size:13px
}
img,video{
width:100%;
border-radius:10px;
max-height:520px;
object-fit:cover
}
.tabs{
display:flex;
gap:5px;
margin-bottom:10px
}
.tabs button{
flex:1;
padding:9px;
border:0;
border-radius:8px
}
.dark{
background:#111827;
color:#eee
}
.dark .wrap,
.dark .card{
background:#1f2937;
color:#eee
}
.dark nav{background:#1f2937}
.dark input,
.dark textarea{
background:#111827;
color:#eee;
border-color:#555
}
.row{
display:flex;
align-items:center;
gap:8px
}
.center{text-align:center}
</style>
</head>

<body>

<div class="wrap">

<header class="top">
Rechod
<span id="userName"></span>
</header>

<main id="app"></main>

<nav>
<button onclick="page('home')">🏠</button>
<button onclick="page('reels')">🎬</button>
<button onclick="page('search')">🔎</button>
<button onclick="page('create')">➕</button>
<button onclick="page('messages')">💬</button>
<button onclick="page('profile')">👤</button>
<button onclick="page('settings')">⚙️</button>
</nav>

</div>

<script type="module">

import{
initializeApp
}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import{
getAuth,
onAuthStateChanged,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut
}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import{
getDatabase,
ref,
push,
set,
onValue,
update,
runTransaction
}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* FIREBASE CONFIG */

const firebaseConfig={

apiKey:"AIzaSyAMJKKGaxwxmvn-0QZcnkKol0eVs1nU_y0",

authDomain:"vibe-social-app-6750d.firebaseapp.com",

databaseURL:
"https://vibe-social-app-6750d-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"vibe-social-app-6750d",

storageBucket:
"vibe-social-app-6750d.firebasestorage.app",

messagingSenderId:"897864313569",

appId:"1:897864313569:web:738169cb0e6694d3d2a5a0",

measurementId:"G-DKZQ133PSN"

};


const fb=initializeApp(firebaseConfig);

const auth=getAuth(fb);

const db=getDatabase(fb);


let me=null;

let current="home";

let profiles={};

let posts={};

let reels={};

let messages={};

let notifs={};


const app=document.getElementById("app");


function esc(x=""){

return String(x).replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);

}


function page(p){

current=p;

render();

}


function render(){

if(!me){

login();

return;

}

document.getElementById("userName").textContent=
profiles[me.uid]?.username||"";

({

home,

reels:reelsPage,

search,

create,

messages:messagesPage,

profile,

settings

}[current]||home)();

}


/* LOGIN */

function login(){

app.innerHTML=`

<div class="card center">

<h1>Rechod</h1>

<p>Social app</p>

<input id="email" placeholder="Email">

<input
id="pass"
type="password"
placeholder="Password">

<input
id="uname"
placeholder="Username (signup)">

<input
id="age"
type="number"
placeholder="Age (signup)">

<button
class="btn"
onclick="signup()">
Sign Up
</button>

<button
class="btn"
onclick="loginNow()">
Login
</button>

<p id="err" class="muted"></p>

</div>

`;

}


window.loginNow=async()=>{

try{

await signInWithEmailAndPassword(
auth,
email.value,
pass.value
);

}catch(e){

err.textContent=e.message;

}

};


window.signup=async()=>{

try{

let c=
await createUserWithEmailAndPassword(
auth,
email.value,
pass.value
);

await set(
ref(db,"profiles/"+c.user.uid),
{
username:
uname.value||
email.value.split("@")[0],

age:Number(age.value)||0,

bio:
"Welcome to my Rechod profile! ❤️",

createdAt:Date.now()
}
);

}catch(e){

err.textContent=e.message;

}

};


/* HOME */

function home(){

let a=
Object.entries(posts)
.sort(
(x,y)=>
(y[1].createdAt||0)-
(x[1].createdAt||0)
);

app.innerHTML=`

<div class="tabs">

<button onclick="page('home')">
Posts
</button>

<button onclick="page('reels')">
Reels
</button>

</div>

${
a.map(
([id,p])=>postCard(id,p)
).join("")
||
'<div class="card center">No posts yet.</div>'
}

`;

}


function postCard(id,p){

let likes=
Object.keys(p.likes||{}).length;

return `

<div class="card">

<div class="row">

<b>
${esc(p.username||"User")}
</b>

<span class="muted">
${new Date(
p.createdAt||Date.now()
).toLocaleString()}
</span>

</div>

${
p.imageUrl
?
`<img
src="${esc(p.imageUrl)}"
onerror="this.style.display='none'">`
:""
}

<p>
${esc(p.caption||"")}
</p>

<button
class="btn"
onclick="like('posts/${id}/likes')">
❤️ ${likes}
</button>

<button
class="btn"
onclick="comment('${id}')">
💬
</button>

<button
class="btn"
onclick="shareText('${esc(
p.caption||"Rechod post"
)}')">
↗
</button>

</div>

`;

}


/* LIKE */

window.like=async path=>{

let r=ref(db,path);

await runTransaction(
r,
v=>v?null:me.uid
);

};


/* COMMENT */

window.comment=async id=>{

let t=prompt("Comment");

if(t)

await push(
ref(db,"posts/"+id+"/comments"),
{
uid:me.uid,
username:
profiles[me.uid]?.username,

text:t,

createdAt:Date.now()
}
);

};


/* SHARE */

window.shareText=t=>

navigator.share

?
navigator.share({
title:"Rechod",
text:t
})

:
alert(t);


/* REELS */

function reelsPage(){

let a=
Object.entries(reels)
.sort(
(x,y)=>
(y[1].createdAt||0)-
(x[1].createdAt||0)
);

app.innerHTML=

a.map(
([id,r])=>`

<div class="card">

<b>
${esc(r.username||"User")}
</b>

<video
src="${esc(r.videoUrl)}"
controls
playsinline
loop>
</video>

<p>
${esc(r.caption||"")}
</p>

<button
class="btn"
onclick="like('reels/${id}/likes')">
❤️ ${Object.keys(r.likes||{}).length}
</button>

<button
class="btn"
onclick="shareText('${esc(
r.caption||"Rechod reel"
)}')">
↗
</button>

</div>

`
).join("")

||
'<div class="card center">No reels yet.</div>';

}


/* CREATE POST + REEL */

function create(){

app.innerHTML=`

<div class="card">

<h3>📷 Create Post</h3>

<input
id="pfile"
type="file"
accept="image/*">

<textarea
id="pcap"
placeholder="Caption">
</textarea>

<progress
id="pbar"
value="0"
max="100"
style="width:100%;display:none">
</progress>

<button
class="btn"
onclick="addPost()">
📷 Photo Post करें
</button>

<p class="muted">
Phone Gallery से photo चुनें
<br>
Firebase Storage की जरूरत नहीं
</p>

</div>


<div class="card">

<h3>🎬 Create Reel</h3>

<input
id="rfile"
type="file"
accept="video/*">

<textarea
id="rcap"
placeholder="Caption">
</textarea>

<progress
id="rbar"
value="0"
max="100"
style="width:100%;display:none">
</progress>

<button
class="btn"
onclick="addReel()">
🎬 Reel डालें
</button>

<p class="muted">
Phone Gallery से video चुनें
<br>
अधिकतम 8 MB
</p>

</div>

`;

}


/* FILE TO DATA */

function fileToDataURL(file,onProgress){

return new Promise(
(resolve,reject)=>{

let fr=new FileReader();

fr.onprogress=e=>{

if(
e.lengthComputable &&
onProgress
)

onProgress(
Math.round(
e.loaded/e.total*100
)
);

};

fr.onload=()=>resolve(fr.result);

fr.onerror=()=>reject(
fr.error||
new Error("File read failed")
);

fr.readAsDataURL(file);

});

}


/* IMAGE COMPRESS */

function compressImage(file,onProgress){

return new Promise(
(resolve,reject)=>{

let fr=new FileReader();

fr.onprogress=e=>{

if(
e.lengthComputable &&
onProgress
)

onProgress(
Math.round(
e.loaded/e.total*50
)
);

};

fr.onload=()=>{

let img=new Image();

img.onload=()=>{

let max=1280;

let w=img.width;

let h=img.height;

if(w>max||h>max){

if(w>=h){

h=Math.round(h*max/w);

w=max;

}else{

w=Math.round(w*max/h);

h=max;

}

}

let c=document.createElement("canvas");

c.width=w;

c.height=h;

c.getContext("2d")
.drawImage(img,0,0,w,h);

let data=
c.toDataURL(
"image/jpeg",
0.78
);

if(onProgress)
onProgress(100);

resolve(data);

};

img.onerror=()=>
reject(
new Error("Image read failed")
);

img.src=fr.result;

};

fr.onerror=()=>
reject(
fr.error||
new Error("File read failed")
);

fr.readAsDataURL(file);

});

}


/* PHOTO POST */

window.addPost=async()=>{

let file=pfile.files[0];

if(!file){

alert("पहले photo चुनें");

return;

}

let bar=pbar;

bar.style.display="block";

bar.value=0;

try{

let data=
await compressImage(
file,
v=>bar.value=v
);

if(
data.length>
8*1024*1024
)

throw new Error(
"Photo बहुत बड़ी है. दूसरी photo चुनें."
);

await push(
ref(db,"posts"),
{
uid:me.uid,

username:
profiles[me.uid]?.username,

imageUrl:data,

caption:pcap.value,

createdAt:Date.now(),

mediaType:"image"
}
);

bar.value=100;

alert("Photo post हो गया ✅");

page("home");

}catch(e){

alert(
"Upload नहीं हुआ: "+
(e.message||e)
);

}

};


/* REEL */

window.addReel=async()=>{

let file=rfile.files[0];

if(!file){

alert("पहले video चुनें");

return;

}

if(
file.size>
8*1024*1024
){

alert(
"Video 8 MB से छोटा रखें"
);

return;

}

let bar=rbar;

bar.style.display="block";

bar.value=0;

try{

let data=
await fileToDataURL(
file,
v=>bar.value=v
);

await push(
ref(db,"reels"),
{
uid:me.uid,

username:
profiles[me.uid]?.username,

videoUrl:data,

caption:rcap.value,

createdAt:Date.now(),

mediaType:"video"
}
);

bar.value=100;

alert("Reel डाल दी गई ✅");

page("reels");

}catch(e){

alert(
"Upload नहीं हुआ: "+
(e.message||e)
);

}

};


/* SEARCH */

function search(){

app.innerHTML=`

<div class="card">

<input
id="sq"
placeholder="Search username"
oninput="doSearch()">

</div>

<div id="results"></div>

`;

}


window.doSearch=()=>{

let q=
sq.value.toLowerCase();

results.innerHTML=

Object.entries(profiles)

.filter(
([id,p])=>
(p.username||"")
.toLowerCase()
.includes(q)
)

.map(
([id,p])=>`

<div class="card row">

<b>
${esc(p.username)}
</b>

<span class="muted">
Age: ${esc(p.age)}
</span>

<button
class="btn"
onclick="message('${id}')">
Message
</button>

</div>

`
)

.join("");

};


/* PROFILE */

function profile(){

let p=
profiles[me.uid]||{};

app.innerHTML=`

<div class="card center">

<h2>
${esc(p.username||"User")}
</h2>

<p>
${esc(p.bio||"")}
</p>

<p>
Age: ${esc(p.age||"")}
</p>

<button
class="btn"
onclick="editProfile()">
Edit Profile
</button>

<button
class="btn danger"
onclick="signOut(auth)">
Logout
</button>

</div>

`;

}


window.editProfile=async()=>{

let u=
prompt(
"Username",
profiles[me.uid]?.username||""
);

let b=
prompt(
"Bio",
profiles[me.uid]?.bio||""
);

if(u!=null)

await update(
ref(db,"profiles/"+me.uid),
{
username:u,
bio:b||""
}
);

};


/* MESSAGES */

function messagesPage(){

let arr=
Object.values(messages)
.sort(
(a,b)=>
(a.createdAt||0)-
(b.createdAt||0)
);

app.innerHTML=`

<div class="card">

<h3>Messages</h3>

${
arr.map(
m=>`

<p>
<b>
${esc(m.fromName||"User")}:
</b>

${esc(m.text)}

</p>

`
).join("")

||

"No messages yet."
}

</div>

`;

}


window.message=uid=>{

let t=prompt("Message");

if(t)

push(
ref(db,"messages"),
{
from:me.uid,

to:uid,

fromName:
profiles[me.uid]?.username,

text:t,

createdAt:Date.now()
}
);

};


/* SETTINGS */

function settings(){

app.innerHTML=`

<div class="card">

<h3>Settings</h3>

<button
class="btn"
onclick="
document.body.classList.toggle('dark')
">
🌙 Dark Mode
</button>

<button
class="btn"
onclick="
alert('Rechod notifications are realtime.')
">
🔔 Notifications
</button>

<button
class="btn"
onclick="
alert('Rechod uses Firebase Authentication and Realtime Database.')
">
ℹ️ About
</button>

</div>

`;

}


/* FIREBASE REALTIME */

onAuthStateChanged(
auth,
u=>{

me=u;

if(!u){

render();

return;

}

onValue(
ref(db,"profiles"),
s=>{
profiles=s.val()||{};
render();
}
);

onValue(
ref(db,"posts"),
s=>{
posts=s.val()||{};
render();
}
);

onValue(
ref(db,"reels"),
s=>{
reels=s.val()||{};
render();
}
);

onValue(
ref(db,"messages"),
s=>{
messages=s.val()||{};
render();
}
);

onValue(
ref(db,"notifications"),
s=>{
notifs=s.val()||{};
}
);

});

</script>

</body>
</html>
