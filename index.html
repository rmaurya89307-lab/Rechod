<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1877f2">
<title>Rechod</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#eef2f7;
color:#172033
}

.wrap{
max-width:520px;
margin:auto;
min-height:100vh;
background:#fff
}

.top{
position:sticky;
top:0;
z-index:5;
background:#1877f2;
color:white;
padding:14px 16px;
font-size:24px;
font-weight:700;
display:flex;
justify-content:space-between
}

nav{
position:sticky;
bottom:0;
z-index:6;
display:flex;
background:#fff;
border-top:1px solid #ddd;
justify-content:space-around;
padding:8px 2px
}

nav button{
border:0;
background:none;
font-size:20px;
padding:5px
}

main{
padding:12px
}

.card{
background:#fff;
border:1px solid #ddd;
border-radius:12px;
padding:12px;
margin-bottom:12px;
box-shadow:0 1px 3px #0001
}

input,textarea,button{
font:inherit
}

input,textarea{
width:100%;
padding:11px;
border:1px solid #ccc;
border-radius:8px;
margin:5px 0
}

.btn{
background:#1877f2;
color:#fff;
border:0;
border-radius:8px;
padding:10px 14px;
margin:4px 2px
}

.danger{
background:#d33
}

.muted{
color:#667085;
font-size:13px
}

img,video{
width:100%;
border-radius:10px;
max-height:520px;
object-fit:cover
}

.tabs{
display:flex;
gap:5px;
margin-bottom:10px
}

.tabs button{
flex:1;
padding:9px;
border:0;
border-radius:8px
}

.dark{
background:#111827;
color:#eee
}

.dark .wrap,
.dark .card{
background:#1f2937;
color:#eee
}

.dark nav{
background:#1f2937
}

.dark input,
.dark textarea{
background:#111827;
color:#eee;
border-color:#555
}

.row{
display:flex;
align-items:center;
gap:8px
}

.center{
text-align:center
}

.progress{
width:100%;
display:none
}
</style>
</head>

<body>

<div class="wrap">

<header class="top">
Rechod
<span id="userName"></span>
</header>

<main id="app"></main>

<nav>
<button onclick="page('home')">🏠</button>
<button onclick="page('reels')">🎬</button>
<button onclick="page('search')">🔎</button>
<button onclick="page('create')">➕</button>
<button onclick="page('messages')">💬</button>
<button onclick="page('profile')">👤</button>
<button onclick="page('settings')">⚙️</button>
</nav>

</div>

<script type="module">

/* =========================
   FIREBASE IMPORTS
========================= */

import{
initializeApp
}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import{
getAuth,
onAuthStateChanged,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut
}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import{
getDatabase,
ref,
push,
set,
onValue,
update,
runTransaction
}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig={

apiKey:"AIzaSyAMJKKGaxwxmvn-0QZcnkKol0eVs1nU_y0",

authDomain:"vibe-social-app-6750d.firebaseapp.com",

databaseURL:
"https://vibe-social-app-6750d-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"vibe-social-app-6750d",

storageBucket:
"vibe-social-app-6750d.firebasestorage.app",

messagingSenderId:"897864313569",

appId:"1:897864313569:web:738169cb0e6694d3d2a5a0",

measurementId:"G-DKZQ133PSN"

};

const fb=initializeApp(firebaseConfig);

const auth=getAuth(fb);

const db=getDatabase(fb);


/* =========================
   CLOUDINARY
========================= */

const CLOUD_NAME="ut6gs93p";

const UPLOAD_PRESET="rechod_upload";


/* =========================
   GLOBAL DATA
========================= */

let me=null;

let current="home";

let profiles={};

let posts={};

let reels={};

let messages={};

let notifs={};

const app=document.getElementById("app");


/* =========================
   ESCAPE
========================= */

function esc(x=""){

return String(x).replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);

}


/* =========================
   PAGE
========================= */

window.page=function(p){

current=p;

render();

};


/* =========================
   RENDER
========================= */

function render(){

if(!me){

login();

return;

}

document.getElementById("userName").textContent=
profiles[me.uid]?.username||"";

({

home,
reels:reelsPage,
search,
create,
messages:messagesPage,
profile,
settings

}[current]||home)();

}


/* =========================
   LOGOUT
========================= */

window.logoutNow=async()=>{

try{

await signOut(auth);

alert("Logout हो गया ✅");

current="home";

}catch(e){

alert("Logout नहीं हुआ: "+e.message);

}

};


/* =========================
   LOGIN
========================= */

function login(){

app.innerHTML=`

<div class="card center">

<h1>Rechod</h1>

<p>Social app</p>

<input
id="email"
placeholder="Email"
type="email">

<input
id="pass"
type="password"
placeholder="Password">

<input
id="uname"
placeholder="Username (signup)">

<input
id="age"
type="number"
placeholder="Age (signup)">

<button
class="btn"
onclick="loginNow()">
Login
</button>

<button
class="btn"
onclick="signup()">
Sign Up
</button>

<p id="err" class="muted"></p>

</div>

`;

}


/* =========================
   LOGIN FUNCTION
========================= */

window.loginNow=async()=>{

try{

await signInWithEmailAndPassword(
auth,
document.getElementById("email").value,
document.getElementById("pass").value
);

}catch(e){

document.getElementById("err").textContent=
e.message;

}

};


/* =========================
   SIGNUP
========================= */

window.signup=async()=>{

try{

let c=
await createUserWithEmailAndPassword(
auth,
document.getElementById("email").value,
document.getElementById("pass").value
);

await set(
ref(db,"profiles/"+c.user.uid),
{
username:
document.getElementById("uname").value||
document.getElementById("email").value.split("@")[0],

age:
Number(document.getElementById("age").value)||0,

bio:
"Welcome to my Rechod profile! ❤️",

createdAt:Date.now()
}
);

alert("Account बन गया ✅");

}catch(e){

document.getElementById("err").textContent=
e.message;

}

};


/* =========================
   HOME
========================= */

function home(){

let a=
Object.entries(posts)
.sort(
(x,y)=>
(y[1].createdAt||0)-
(x[1].createdAt||0)
);

app.innerHTML=`

<div class="tabs">

<button onclick="page('home')">
Posts
</button>

<button onclick="page('reels')">
Reels
</button>

</div>

${
a.map(
([id,p])=>postCard(id,p)
).join("")
||
'<div class="card center">No posts yet.</div>'
}

`;

}


/* =========================
   POST CARD
========================= */

function postCard(id,p){

let likes=
Object.keys(p.likes||{}).length;

return `

<div class="card">

<div class="row">

<b>
${esc(p.username||"User")}
</b>

<span class="muted">
${new Date(
p.createdAt||Date.now()
).toLocaleString()}
</span>

</div>

${
p.imageUrl
?
`<img
src="${esc(p.imageUrl)}"
onerror="this.style.display='none'">`
:""
}

<p>
${esc(p.caption||"")}
</p>

<button
class="btn"
onclick="like('posts/${id}/likes')">
❤️ ${likes}
</button>

<button
class="btn"
onclick="comment('${id}')">
💬
</button>

<button
class="btn"
onclick="shareText('${esc(
p.caption||"Rechod post"
)}')">
↗
</button>

</div>

`;

}


/* =========================
   LIKE
========================= */

window.like=async path=>{

let r=ref(db,path);

await runTransaction(
r,
v=>v?null:me.uid
);

};


/* =========================
   COMMENT
========================= */

window.comment=async id=>{

let t=prompt("Comment");

if(t)

await push(
ref(db,"posts/"+id+"/comments"),
{
uid:me.uid,
username:
profiles[me.uid]?.username||"User",
text:t,
createdAt:Date.now()
}
);

};


/* =========================
   SHARE
========================= */

window.shareText=t=>{

if(navigator.share){

navigator.share({
title:"Rechod",
text:t
});

}else{

alert(t);

}

};


/* =========================
   REELS
========================= */

function reelsPage(){

let a=
Object.entries(reels)
.sort(
(x,y)=>
(y[1].createdAt||0)-
(x[1].createdAt||0)
);

app.innerHTML=

a.map(
([id,r])=>`

<div class="card">

<b>
${esc(r.username||"User")}
</b>

<video
src="${esc(r.videoUrl)}"
controls
playsinline
loop>
</video>

<p>
${esc(r.caption||"")}
</p>

<button
class="btn"
onclick="like('reels/${id}/likes')">
❤️ ${Object.keys(r.likes||{}).length}
</button>

<button
class="btn"
onclick="shareText('${esc(
r.caption||"Rechod reel"
)}')">
↗
</button>

</div>

`
).join("")

||
'<div class="card center">No reels yet.</div>';

}


/* =========================
   CREATE
========================= */

function create(){

app.innerHTML=`

<div class="card">

<h3>📷 Create Post</h3>

<input
id="pfile"
type="file"
accept="image/*">

<textarea
id="pcap"
placeholder="Caption"></textarea>

<progress
id="pbar"
class="progress"
value="0"
max="100">
</progress>

<button
class="btn"
onclick="addPost()">
📷 Photo Post करें
</button>

<p class="muted">
Mobile Gallery से photo चुनें
<br>
Cloudinary पर direct upload होगा
</p>

</div>


<div class="card">

<h3>🎬 Create Reel</h3>

<input
id="rfile"
type="file"
accept="video/*">

<textarea
id="rcap"
placeholder="Caption"></textarea>

<progress
id="rbar"
class="progress"
value="0"
max="100">
</progress>

<button
class="btn"
onclick="addReel()">
🎬 Reel डालें
</button>

<p class="muted">
Mobile Gallery से video चुनें
<br>
अधिकतम 100 MB
</p>

</div>

`;

}


/* =========================
   CLOUDINARY UPLOAD
========================= */

async function cloudinaryUpload(file,onProgress){

let url=
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`;

let form=new FormData();

form.append("file",file);

form.append(
"upload_preset",
UPLOAD_PRESET
);

return new Promise((resolve,reject)=>{

let xhr=new XMLHttpRequest();

xhr.open("POST",url);

xhr.upload.onprogress=e=>{

if(
e.lengthComputable &&
onProgress
){

onProgress(
Math.round(
(e.loaded/e.total)*100
)
);

}

};

xhr.onload=()=>{

try{

let data=JSON.parse(xhr.responseText);

if(xhr.status>=200 && xhr.status<300){

resolve(data);

}else{

reject(
new Error(
data.error?.message||
"Cloudinary upload failed"
)
);

}

}catch(e){

reject(e);

}

};

xhr.onerror=()=>{

reject(
new Error("Internet/upload error")
);

};

xhr.send(form);

});

}


/* =========================
   PHOTO POST
========================= */

window.addPost=async()=>{

let file=
document.getElementById("pfile").files[0];

if(!file){

alert("पहले photo चुनें");

return;

}


/* 10 MB PHOTO LIMIT */

if(file.size>10*1024*1024){

alert("Photo 10 MB से छोटी रखें");

return;

}

let bar=
document.getElementById("pbar");

bar.style.display="block";

bar.value=0;

try{

let result=
await cloudinaryUpload(
file,
p=>{
bar.value=p;
}
);

let imageUrl=result.secure_url;

await push(
ref(db,"posts"),
{
uid:me.uid,

username:
profiles[me.uid]?.username||"User",

imageUrl:imageUrl,

caption:
document.getElementById("pcap").value,

createdAt:Date.now(),

mediaType:"image"
}
);

bar.value=100;

alert("Photo post हो गया ✅");

page("home");

}catch(e){

alert(
"Photo upload नहीं हुआ: "+
(e.message||e)
);

}

};


/* =========================
   REEL UPLOAD
========================= */

window.addReel=async()=>{

let file=
document.getElementById("rfile").files[0];

if(!file){

alert("पहले video चुनें");

return;

}


/* 100 MB VIDEO LIMIT */

if(file.size>100*1024*1024){

alert("Video 100 MB से छोटी रखें");

return;

}


/* VIDEO TYPE CHECK */

if(!file.type.startsWith("video/")){

alert("सिर्फ video file चुनें");

return;

}

let bar=
document.getElementById("rbar");

bar.style.display="block";

bar.value=0;

try{

let result=
await cloudinaryUpload(
file,
p=>{
bar.value=p;
}
);

let videoUrl=result.secure_url;

await push(
ref(db,"reels"),
{
uid:me.uid,

username:
profiles[me.uid]?.username||"User",

videoUrl:videoUrl,

caption:
document.getElementById("rcap").value,

createdAt:Date.now(),

mediaType:"video"
}
);

bar.value=100;

alert("Reel डाल दी गई ✅");

page("reels");

}catch(e){

alert(
"Video upload नहीं हुआ: "+
(e.message||e)
);

}

};


/* =========================
   SEARCH
========================= */

function search(){

app.innerHTML=`

<div class="card">

<input
id="sq"
placeholder="Search username"
oninput="doSearch()">

</div>

<div id="results"></div>

`;

}


window.doSearch=()=>{

let q=
document.getElementById("sq").value
.toLowerCase();

document.getElementById("results").innerHTML=

Object.entries(profiles)

.filter(
([id,p])=>
(p.username||"")
.toLowerCase()
.includes(q)
)

.map(
([id,p])=>`

<div class="card row">

<b>
${esc(p.username||"User")}
</b>

<span class="muted">
Age: ${esc(p.age||"")}
</span>

<button
class="btn"
onclick="message('${id}')">
Message
</button>

</div>

`
)

.join("");

};


/* =========================
   PROFILE
========================= */

function profile(){

let p=
profiles[me.uid]||{};

app.innerHTML=`

<div class="card center">

<h2>
${esc(p.username||"User")}
</h2>

<p>
${esc(p.bio||"")}
</p>

<p>
Age: ${esc(p.age||"")}
</p>

<button
class="btn"
onclick="editProfile()">
Edit Profile
</button>

<br>

<button
class="btn danger"
onclick="logoutNow()">
🚪 Logout
</button>

</div>

`;

}


/* =========================
   EDIT PROFILE
========================= */

window.editProfile=async()=>{

let u=
prompt(
"Username",
profiles[me.uid]?.username||""
);

let b=
prompt(
"Bio",
profiles[me.uid]?.bio||""
);

if(u!=null)

await update(
ref(db,"profiles/"+me.uid),
{
username:u,
bio:b||""
}
);

};


/* =========================
   MESSAGES
========================= */

function messagesPage(){

let arr=
Object.values(messages)
.sort(
(a,b)=>
(a.createdAt||0)-
(b.createdAt||0)
);

app.innerHTML=`

<div class="card">

<h3>Messages</h3>

${
arr.map(
m=>`

<p>

<b>
${esc(m.fromName||"User")}:
</b>

${esc(m.text)}

</p>

`
).join("")

||

"No messages yet."
}

</div>

`;

}


/* =========================
   SEND MESSAGE
========================= */

window.message=uid=>{

let t=prompt("Message");

if(t)

push(
ref(db,"messages"),
{
from:me.uid,

to:uid,

fromName:
profiles[me.uid]?.username||"User",

text:t,

createdAt:Date.now()
}
);

};


/* =========================
   SETTINGS
========================= */

function settings(){

app.innerHTML=`

<div class="card">

<h3>Settings</h3>

<button
class="btn"
onclick="
document.body.classList.toggle('dark')
">
🌙 Dark Mode
</button>

<button
class="btn"
onclick="
alert('Rechod notifications are realtime.')
">
🔔 Notifications
</button>

<button
class="btn"
onclick="
alert('Rechod uses Firebase Authentication, Realtime Database and Cloudinary.')
">
ℹ️ About
</button>

<br>

<button
class="btn danger"
onclick="logoutNow()">
🚪 Logout
</button>

</div>

`;

}


/* =========================
   FIREBASE REALTIME
========================= */

onAuthStateChanged(
auth,
u=>{

me=u;

if(!u){

render();

return;

}


/* PROFILES */

onValue(
ref(db,"profiles"),
s=>{

profiles=s.val()||{};

render();

}
);


/* POSTS */

onValue(
ref(db,"posts"),
s=>{

posts=s.val()||{};

render();

}
);


/* REELS */

onValue(
ref(db,"reels"),
s=>{

reels=s.val()||{};

render();

}
);


/* MESSAGES */

onValue(
ref(db,"messages"),
s=>{

messages=s.val()||{};

render();

}
);


/* NOTIFICATIONS */

onValue(
ref(db,"notifications"),
s=>{

notifs=s.val()||{};

}
);

});

</script>

</body>
</html>
