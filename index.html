.preview{width:100%;max-height:350px;object-fit:contain;background:#111;border-radius:10px;margin:10px 0}

hr{border:0;border-top:1px solid #ddd;margin:15px 0}

 projectId:"vibe-social-app-6750d",
 storageBucket:"vibe-social-app-6750d.firebasestorage.app",
 messagingSenderId:"897864313569",
 appId:"1:897864313569:web:738169cb0e6694d3d2a5a5",
 measurementId:"G-DKZQ133PSN"
};

const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
const db=getDatabase(firebaseApp);

const CLOUD_NAME="ut6gs93p";
const UPLOAD_PRESET="rechod_upload";


/* ================= STATE ================= */

let me=null,current="home";
let profiles={},posts={},reels={},stories={},messages={},notifs={};
let selectedFilter="normal";
let selectedStoryFilter="normal";
let postFiles=[],storyFileData=null,reelFileData=null;
let chatUserId=null,viewingProfileId=null;
let phoneConfirmation=null,recaptchaVerifier=null;

let callPC=null;
let callStream=null;
let remoteStream=null;
let currentCallId=null;
let currentCallType="video";
let callRole=null;
let callListenerStarted=false;

const filters={
 normal:"none",bright:"brightness(1.25)",vivid:"saturate(1.5)",
 vintage:"sepia(.45) contrast(.9)",warm:"sepia(.25) saturate(1.25)",
 cool:"hue-rotate(15deg) saturate(.9)",bw:"grayscale(1)",
 sunset:"sepia(.35) saturate(1.5) contrast(1.1)",
 cinematic:"contrast(1.2) saturate(.8)",glow:"brightness(1.2) saturate(1.2)",
 pink:"hue-rotate(320deg) saturate(1.3)",nature:"saturate(1.7)",

 dark:"brightness(.7) contrast(1.2)"
};

 normal:"Normal",bright:"Bright",vivid:"Vivid",vintage:"Vintage",

 cinematic:"Cinematic",glow:"Glow",pink:"Pink",nature:"Nature",
 dramatic:"Dramatic",fade:"Fade",dark:"Dark"
};

const countries=[
["+91","🇮🇳 India"],["+1","🇺🇸 USA"],["+44","🇬🇧 UK"],
["+971","🇦🇪 UAE"],["+61","🇦🇺 Australia"],["+81","🇯🇵 Japan"],
["+49","🇩🇪 Germany"],["+33","🇫🇷 France"],["+39","🇮🇹 Italy"],
["+7","🇷🇺 Russia"],["+86","🇨🇳 China"],["+92","🇵🇰 Pakistan"],
["+880","🇧🇩 Bangladesh"],["+977","🇳🇵 Nepal"],["+94","🇱🇰 Sri Lanka"],
["+966","🇸🇦 Saudi Arabia"],["+974","🇶🇦 Qatar"],["+965","🇰🇼 Kuwait"],
["+968","🇴🇲 Oman"],["+27","🇿🇦 South Africa"],["+55","🇧🇷 Brazil"],
["+62","🇮🇩 Indonesia"],["+98","🇮🇷 Iran"],["+82","🇰🇷 South Korea"],
["+60","🇲🇾 Malaysia"],["+65","🇸🇬 Singapore"],["+66","🇹🇭 Thailand"],
["+90","🇹🇷 Turkey"],["+84","🇻🇳 Vietnam"]
];


/* ================= AUTH ================= */

function authScreen(){

 const opts=countries.map((x,i)=>
 `<option value="${x[0]}" ${i===0?"selected":""}>${x[1]} (${x[0]})</option>`
 ).join("");

 document.getElementById("header").classList.add("hidden");
 document.getElementById("bottom").classList.add("hidden");

 document.getElementById("app").innerHTML=`

 <div class="page">
  <div class="auth-title">Rechod</div>
  <div class="auth-sub">Connect • Share • Chat</div>

  <div class="card">

   <input id="name" placeholder="Name">
   <input id="username" placeholder="Username">
   <input id="email" placeholder="Email या Username">
   <input id="password" type="password" placeholder="Password">

   <button class="primary" onclick="signup()">Create Account</button>
   <button class="secondary" style="width:100%" onclick="login()">Login</button>
   <button class="primary" onclick="googleLogin()">🔵 Google Login</button>

   <hr>

   <h3>📱 Phone Login</h3>

   <div class="country-row">
    <select id="countryCode">${opts}</select>
    <input id="phone" type="tel" inputmode="numeric" placeholder="Phone Number">
   </div>

   <div id="recaptcha-container"></div>

   <button class="primary" onclick="sendOTP()">📱 Send OTP</button>

   <div id="otpArea" class="hidden">
    <input id="otp" maxlength="6" inputmode="numeric" placeholder="6 Digit OTP">
    <button class="primary" onclick="verifyOTP()">Verify OTP</button>
   </div>

   <div id="err" class="err"></div>

  </div>
 </div>`;
}


/* ================= SIGNUP ================= */

window.signup=async()=>{

 const name=document.getElementById("name").value.trim();
 const username=document.getElementById("username").value.trim().toLowerCase().replace(/\s/g,"");
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const err=document.getElementById("err");

 if(!name||!username||!email||!password){
  err.textContent="सभी details भरें";
  return;
 }

 if(!/^[a-z0-9_.]{3,20}$/.test(username)){
  err.textContent="Username 3-20 characters का रखें";
  return;
 }

 try{

  const existing=await get(ref(db,"profiles"));

  if(existing.exists()){
   const all=existing.val();
   const used=Object.values(all).some(p=>
    String(p.username||"").toLowerCase()===username
   );

   if(used){
    err.textContent="यह username पहले से मौजूद है";
    return;
   }
  }

  const r=await createUserWithEmailAndPassword(auth,email,password);

  await updateProfile(r.user,{displayName:name});

  await set(ref(db,"profiles/"+r.user.uid),{
   uid:r.user.uid,name,username,email,phone:"",
   photo:"",bio:"",followers:{},following:{},
   settings:{},createdAt:Date.now()
  });

 }catch(e){
  err.textContent="❌ "+(e.code||e.message);
 }
};


/* ================= LOGIN EMAIL/USERNAME ================= */

window.login=async()=>{

 const value=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const err=document.getElementById("err");

 if(!value||!password){
  err.textContent="Login details भरें";
  return;
 }

 try{

  let email=value;

  if(!value.includes("@")){

   const snap=await get(ref(db,"profiles"));
   const all=snap.val()||{};

   const found=Object.values(all).find(p=>
    String(p.username||"").toLowerCase()===value.toLowerCase()
   );

   if(!found){
    err.textContent="Username नहीं मिला";
    return;
   }

   email=found.email;

   if(!email){
    err.textContent="इस account में email login उपलब्ध नहीं है";
    return;
   }
  }

  await signInWithEmailAndPassword(auth,email,password);

 }catch(e){
  err.textContent="❌ "+(e.code||e.message);
 }
};


/* ================= GOOGLE ================= */

window.googleLogin=async()=>{

 try{

  const result=await signInWithPopup(auth,new GoogleAuthProvider());
  const u=result.user;
  const pr=ref(db,"profiles/"+u.uid);
  const snap=await get(pr);

  if(!snap.exists()){

   let base=(u.displayName||"user")
    .toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,12);

   if(!base)base="user";

   let username=base;
   let n=1;

   const all=(await get(ref(db,"profiles"))).val()||{};

   while(Object.values(all).some(p=>p.username===username)){
    username=base+n++;
   }

   await set(pr,{
    uid:u.uid,name:u.displayName||"Rechod User",
    username,email:u.email||"",phone:"",
    photo:u.photoURL||"",bio:"",
    followers:{},following:{},settings:{},
    createdAt:Date.now()
   });
  }

 }catch(e){
  alert("Google Login Error:\n"+(e.code||e.message));
 }
};


/* ================= PHONE OTP ================= */

window.sendOTP=async()=>{

 let number=document.getElementById("phone").value.replace(/\D/g,"");
 const code=document.getElementById("countryCode").value;

 if(!number){
  alert("Phone number डालें");
  return;
 }

 number=number.replace(/^0+/,"");

 try{

  if(recaptchaVerifier){
   try{recaptchaVerifier.clear()}catch(e){}
  }

  recaptchaVerifier=new RecaptchaVerifier(
   auth,"recaptcha-container",{size:"normal"}
  );

  await recaptchaVerifier.render();

  phoneConfirmation=await signInWithPhoneNumber(
   auth,code+number,recaptchaVerifier
  );

  document.getElementById("otpArea").classList.remove("hidden");
  alert("✅ OTP भेज दिया गया");

 }catch(e){

  alert("❌ OTP Error:\n"+(e.code||e.message));

  try{recaptchaVerifier?.clear()}catch(x){}
  recaptchaVerifier=null;
 }
};


window.verifyOTP=async()=>{

 const otp=document.getElementById("otp").value.trim();

 if(!phoneConfirmation){
  alert("पहले OTP भेजें");
  return;
 }

 try{

  const result=await phoneConfirmation.confirm(otp);
  const u=result.user;
  const pr=ref(db,"profiles/"+u.uid);
  const snap=await get(pr);

  if(!snap.exists()){

   await set(pr,{
    uid:u.uid,name:"Rechod User",
    username:"user"+u.uid.slice(0,6),
    email:u.email||"",phone:u.phoneNumber||"",
    photo:"",bio:"",followers:{},following:{},
    settings:{},createdAt:Date.now()
   });
  }

  phoneConfirmation=null;
  alert("✅ Login successful");

 }catch(e){
  alert("❌ "+(e.code||e.message));
 }
};


/* ================= AUTH STATE ================= */

onAuthStateChanged(auth,async u=>{

 if(!u){
  me=null;
  authScreen();
  return;
 }

 me=u;

 await loadData();

 document.getElementById("header").classList.remove("hidden");
 document.getElementById("bottom").classList.remove("hidden");

 startIncomingCallListener();

 page("home");
});


/* ================= DATA ================= */

async function loadData(){

 onValue(ref(db,"profiles"),s=>{
  profiles=s.val()||{};
  render();
 });

 onValue(ref(db,"posts"),s=>{
  posts=s.val()||{};
  render();
 });

 onValue(ref(db,"reels"),s=>{
  reels=s.val()||{};
  render();
 });

 onValue(ref(db,"stories"),s=>{
  stories=s.val()||{};
  render();
 });

 onValue(ref(db,"messages"),s=>{
  messages=s.val()||{};
  render();
 });

 onValue(ref(db,"notifs/"+me.uid),s=>{
  notifs=s.val()||{};
  render();
 });
}


/* ================= PAGE ================= */

window.page=p=>{

 current=p;

 document.querySelectorAll(".nav").forEach(x=>{
  x.classList.toggle("active",x.dataset.page===p);
 });

 render();
 window.scrollTo(0,0);
};


/* ================= RENDER ================= */

function render(){

 if(!me)return;

 const app=document.getElementById("app");

 if(current==="home")app.innerHTML=homePage();
 else if(current==="reels")app.innerHTML=reelsPage();
 else if(current==="search")app.innerHTML=searchPage();
 else if(current==="create")app.innerHTML=createPage();
 else if(current==="messages")app.innerHTML=messagesPage();
 else if(current==="profile")app.innerHTML=profilePage();
 else if(current==="settings")app.innerHTML=settingsPage();
 else if(current==="notifications")app.innerHTML=notificationsPage();
 else if(current==="viewProfile")app.innerHTML=viewProfilePage();

 if(current==="messages"&&chatUserId){
  setTimeout(()=>{
   const b=document.getElementById("chatBox");
   if(b)b.scrollTop=b.scrollHeight;
  },30);
 }
}


/* ================= HOME ================= */

function homePage(){

 let storiesHTML=`
 <div class="story">
  <div onclick="page('create')" style="font-size:42px">＋</div>
  <small>Your Story</small>
 </div>`;

 Object.entries(stories).forEach(([id,s])=>{

  if(Date.now()-(s.createdAt||0)>86400000)return;

  const p=profiles[s.uid]||{};

  storiesHTML+=`
  <div class="story" onclick="viewStory('${id}')">
   <img class="story-img" src="${s.url||p.photo||avatar(s.uid)}">
   <div>${escapeHTML(p.username||"user")}</div>
  </div>`;
 });

 let html="";

 Object.entries(posts)
 .sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0))
 .forEach(([id,p])=>html+=postCard(id,p));

 return`
 <div class="page">
  <div class="story-row">${storiesHTML}</div>
  ${html||`<div class="card">अभी कोई post नहीं है।</div>`}
 </div>`;
}


/* ================= POST ================= */

function postCard(id,p){

 const owner=profiles[p.uid]||{};
 const images=Array.isArray(p.images)?p.images:[];

 let media=images.length===1
 ?`<img class="post-img" style="filter:${filters[p.filter]||"none"}" src="${images[0]}">`
 :`<div class="multi-grid">${images.map(x=>
   `<img style="filter:${filters[p.filter]||"none"}" src="${x}">`
  ).join("")}</div>`;

 const likes=Object.keys(p.likes||{}).length;
 const liked=!!p.likes?.[me.uid];
 const comments=Object.keys(p.comments||{}).length;

 return`
 <div class="card">

  <div class="userline">
   <img class="avatar" src="${owner.photo||avatar(p.uid)}">
   <div>
    <b>${escapeHTML(owner.username||"user")}</b><br>
    <small>${timeAgo(p.createdAt)}</small>
   </div>
  </div>

  ${media}

  ${p.caption?`<p>${escapeHTML(p.caption)}</p>`:""}
  ${p.song?`<audio controls src="${p.song}"></audio>`:""}

  <div class="actions">
   <button class="action" onclick="likePost('${id}')">
    ${liked?"❤️":"🤍"} ${likes}
   </button>

   <button class="action" onclick="commentPost('${id}')">
    💬 ${comments}
   </button>

   <button class="action" onclick="sharePost('${id}')">↗️</button>
  </div>

 </div>`;
}

window.likePost=async id=>{

 const r=ref(db,`posts/${id}/likes/${me.uid}`);

 await runTransaction(r,v=>v?null:true);

 const p=posts[id];

 if(p&&p.uid!==me.uid){

/* ================= CLOUDINARY ================= */

async function cloudinaryUpload(file,type="auto"){

 const fd=new FormData();

 fd.append("file",file);
 fd.append("upload_preset",UPLOAD_PRESET);

 const r=await fetch(
  `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${type}/upload`,
  {method:"POST",body:fd}
 );

 const d=await r.json();

 if(!r.ok||!d.secure_url)
  throw new Error(d.error?.message||"Cloudinary upload failed");

 return d.secure_url;
}

/* =========================================================
   REAL WEBRTC AUDIO / VIDEO CALL
========================================================= */

const rtcConfig={
 iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"}
 ]
};

function callUI(name,type,incoming=false){

 document.getElementById("callScreen")?.remove();

 document.body.insertAdjacentHTML("beforeend",`
 <div id="callScreen" class="call-screen">

  <video id="remoteVideo"
   class="remote-video"
   autoplay playsinline></video>

  <video id="localVideo"
   class="local-video"
   autoplay muted playsinline></video>

  <div class="call-info">
   <b>${escapeHTML(name)}</b>
   <div id="callStatus">${incoming?"Incoming call...":"Calling..."}</div>
  </div>

  <div class="call-controls">

   <button class="call-btn"
    onclick="toggleMic()">🎤</button>

   ${type==="video"?`
   <button class="call-btn"
    onclick="toggleCamera()">📷</button>`:""}

   <button class="call-btn call-end"
    onclick="hangupCall()">📵</button>

  </div>

 </div>`);
}

function setCallStatus(x){

 const e=document.getElementById("callStatus");

 if(e)e.textContent=x;
}

window.startCall=async(uid,type)=>{

 if(!me)return;

 if(uid===me.uid){
  alert("खुद को call नहीं कर सकते");
  return;
 }

 try{

  currentCallType=type;
  callRole="caller";

  currentCallId=push(ref(db,"calls")).key;

  callUI(
   profiles[uid]?.name||
   profiles[uid]?.username||
   "User",
   type
  );

  callStream=await navigator.mediaDevices.getUserMedia({
   audio:true,
   video:type==="video"
  });

  document.getElementById("localVideo").srcObject=callStream;

  callPC=new RTCPeerConnection(rtcConfig);

  callStream.getTracks().forEach(t=>
   callPC.addTrack(t,callStream)
  );

  callPC.ontrack=e=>{

   remoteStream=e.streams[0];

   const v=document.getElementById("remoteVideo");

   if(v)v.srcObject=remoteStream;
  };

  callPC.onicecandidate=async e=>{

   if(!e.candidate)return;

   await set(
    push(ref(db,`calls/${currentCallId}/callerCandidates`)),
    e.candidate.toJSON()
   );
  };

  const callRef=ref(db,`calls/${currentCallId}`);

  await set(callRef,{
   callerId:me.uid,
   calleeId:uid,
   callerName:profiles[me.uid]?.name||me.displayName||"Rechod User",
   callerUsername:profiles[me.uid]?.username||"user",
   type,
   status:"ringing",
   createdAt:Date.now()
  });

  await set(ref(db,`incomingCalls/${uid}/${currentCallId}`),{
   callerId:me.uid,
   callerName:profiles[me.uid]?.name||"Rechod User",
   callerUsername:profiles[me.uid]?.username||"user",
   type,
   createdAt:Date.now()
  });

  onDisconnect(callRef).update({status:"ended"});

  const offer=await callPC.createOffer();

  await callPC.setLocalDescription(offer);

  await update(callRef,{
   offer:{
    type:offer.type,
    sdp:offer.sdp
   }
  });

  onValue(callRef,snap=>{

   const data=snap.val();

   if(!data||data.status==="ended"||data.status==="rejected"){
    cleanupCall(false);
    return;
   }

   if(data.answer&&!callPC.currentRemoteDescription){

    callPC.setRemoteDescription(
     new RTCSessionDescription(data.answer)
    );

    setCallStatus("Connected");
   }
  });

  onValue(
   ref(db,`calls/${currentCallId}/calleeCandidates`),
   snap=>{
    snap.forEach(c=>{
     if(callPC)
      callPC.addIceCandidate(
       new RTCIceCandidate(c.val())
      ).catch(()=>{});
    });
   }
  );

 }catch(e){

  console.error(e);
  alert("Call start error:\n"+e.message);
  cleanupCall(false);
 }
};


/* ================= INCOMING CALL ================= */

function startIncomingCallListener(){

 if(callListenerStarted||!me)return;

 callListenerStarted=true;

 onValue(ref(db,`incomingCalls/${me.uid}`),snap=>{

  const all=snap.val()||{};

  const entries=Object.entries(all);

  if(!entries.length)return;

  const [id,c]=entries[entries.length-1];

  if(c&&id!==currentCallId)
   showIncomingCall(id,c);
 });
}

function showIncomingCall(id,c){

 document.getElementById("incomingCall")?.remove();

 document.body.insertAdjacentHTML("beforeend",`
 <div id="incomingCall" class="incoming">

  <div class="incoming-box">

   <h2>${c.type==="video"?"📹":"📞"}</h2>

   <h3>${escapeHTML(c.callerName||"Rechod User")}</h3>

   <p>@${escapeHTML(c.callerUsername||"user")}</p>

   <p>Incoming ${c.type} call...</p>

   <button class="primary"
    onclick="acceptCall('${id}')">
    ✅ Accept
   </button>

   <button class="primary"
    style="background:#e53935"
    onclick="rejectCall('${id}')">
    ❌ Reject
   </button>

  </div>

 </div>`);
}

window.acceptCall=async id=>{

 document.getElementById("incomingCall")?.remove();

 try{

  const snap=await get(ref(db,`calls/${id}`));
  const c=snap.val();

  if(!c){
   alert("Call समाप्त हो चुकी है");
   return;
  }

  currentCallId=id;
  currentCallType=c.type;
  callRole="callee";

  callUI(c.callerName,c.type);

  callStream=await navigator.mediaDevices.getUserMedia({
   audio:true,
   video:c.type==="video"
  });

  document.getElementById("localVideo").srcObject=callStream;

  callPC=new RTCPeerConnection(rtcConfig);

  callStream.getTracks().forEach(t=>
   callPC.addTrack(t,callStream)
  );

  callPC.ontrack=e=>{
   remoteStream=e.streams[0];
   document.getElementById("remoteVideo").srcObject=remoteStream;
  };

  callPC.onicecandidate=async e=>{

   if(!e.candidate)return;

   await set(
    push(ref(db,`calls/${id}/calleeCandidates`)),
    e.candidate.toJSON()
   );
  };

  await callPC.setRemoteDescription(
   new RTCSessionDescription(c.offer)
  );

  const answer=await callPC.createAnswer();

  await callPC.setLocalDescription(answer);

  await update(ref(db,`calls/${id}`),{
   answer:{
    type:answer.type,
    sdp:answer.sdp
   },
   status:"accepted"
  });

  setCallStatus("Connected");

  onValue(
   ref(db,`calls/${id}/callerCandidates`),
   snap=>{
    snap.forEach(x=>{
     if(callPC)
      callPC.addIceCandidate(
       new RTCIceCandidate(x.val())
      ).catch(()=>{});
    });
   }
  );

  onValue(ref(db,`calls/${id}`),s=>{
   const d=s.val();

   if(!d||d.status==="ended"){
    cleanupCall(false);
   }
  });

  await remove(ref(db,`incomingCalls/${me.uid}/${id}`));

 }catch(e){

  alert("Call accept error:\n"+e.message);
  cleanupCall(false);
 }
};

window.rejectCall=async id=>{

 await update(ref(db,`calls/${id}`),{
  status:"rejected"
 });

 await remove(ref(db,`incomingCalls/${me.uid}/${id}`));
 document.getElementById("incomingCall")?.remove();
};

window.toggleMic=()=>{

 if(!callStream)return;

 const t=callStream.getAudioTracks()[0];

 if(t)t.enabled=!t.enabled;

};

window.toggleCamera=()=>{

 if(!callStream)return;

 const t=callStream.getVideoTracks()[0];

 if(t)t.enabled=!t.enabled;

};

window.hangupCall=async()=>{

 if(currentCallId){

  try{
   await update(ref(db,`calls/${currentCallId}`),{
    status:"ended",endedAt:Date.now()
   });
  }catch(e){}
 }

 cleanupCall(false);
};

function cleanupCall(removeRemote=true){

 try{
  callPC?.close();
 }catch(e){}

 callPC=null;

 if(callStream){

  callStream.getTracks().forEach(t=>t.stop());
  callStream=null;
 }

 remoteStream=null;

 document.getElementById("callScreen")?.remove();
 document.getElementById("incomingCall")?.remove();

 if(removeRemote&&currentCallId){
  remove(ref(db,`incomingCalls/${me.uid}/${currentCallId}`)).catch(()=>{});
 }

 currentCallId=null;
 callRole=null;
}

/* ================= HELPERS ================= */

function avatar(uid){

 return "https://ui-avatars.com/api/?name="+
 encodeURIComponent(
  profiles[uid]?.name||
  profiles[uid]?.username||
  "User"
 );
}

function timeAgo(t){

 if(!t)return "";

 const s=Math.floor((Date.now()-t)/1000);

 if(s<60)return"अभी";

 const m=Math.floor(s/60);

 if(m<60)return m+" min";

 const h=Math.floor(m/60);

 if(h<24)return h+" घंटे";

 return Math.floor(h/24)+" दिन";
}

function escapeHTML(s){

 return String(s??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}
