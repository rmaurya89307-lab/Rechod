/[&<>"']/g,

"<":"&lt;",
">":"&gt;",

/* FILTER BUTTONS */

function filterButtons(fn){

let arr=[
["normal","Normal"],
["bright","Bright"],
["vivid","Vivid"],
["vintage","Vintage"],
["warm","Warm"],
["cool","Cool"],
["bw","B&W"],
["sunset","Sunset"],
["cinematic","Cinematic"],
["glow","Glow"],
["pink","Pink"],
["nature","Nature"],
["dramatic","Dramatic"],
["fade","Fade"],
["dark","Dark"]
];

return arr.map(x=>`

<button
type="button"
class="filter-btn ${x[0]=="normal"?"active":""}"
onclick="${fn}('${x[0]}',this)">

${x[1]}

</button>

`).join("");

}


/* FILTER */

window.setFilter=(name,button)=>{

selectedFilter=name;

let box=button.closest(".filter-box");

if(box){

box.querySelectorAll(".filter-btn")
.forEach(x=>x.classList.remove("active"));

}

button.classList.add("active");

let img=
document.getElementById("postPreviewImg");

if(img){

img.className="f-"+name;

}

};


/* STORY FILTER */

window.setStoryFilter=(name,button)=>{

selectedStoryFilter=name;

let box=button.closest(".filter-box");

if(box){

box.querySelectorAll(".filter-btn")
.forEach(x=>x.classList.remove("active"));

}

button.classList.add("active");

let media=
document.getElementById("storyPreviewMedia");

if(media){

media.className=
"story-media f-"+name;

}

};

/* CLOUDINARY UPLOAD */

async function cloudinaryUpload(file,onProgress){

/* FIXED URL */

let url=
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`;

let form=new FormData();

form.append("file",file);

form.append(
"upload_preset",
UPLOAD_PRESET
);

return new Promise((resolve,reject)=>{

let xhr=new XMLHttpRequest();

xhr.open("POST",url);

xhr.upload.onprogress=e=>{

if(e.lengthComputable&&onProgress){

onProgress(
Math.round(
(e.loaded/e.total)*100
)
);

}

};

xhr.onload=()=>{

try{

let data=
JSON.parse(xhr.responseText);

if(
xhr.status>=200&&
xhr.status<300
){

resolve(data);

}else{

reject(
new Error(
data.error?.message||
"Cloudinary upload failed"
)
);

}

}catch(e){

reject(e);

}

};

xhr.onerror=()=>{

reject(
new Error("Internet/upload error")
);

};

xhr.send(form);

});

}

/* FOLLOW / UNFOLLOW */

window.toggleFollow=async uid=>{

if(!me||uid===me.uid)return;

let amFollowing=
!!(profiles[me.uid]?.following?.[uid]);

let updates={};

if(amFollowing){

updates[
"profiles/"+me.uid+
"/following/"+uid
]=null;

updates[
"profiles/"+uid+
"/followers/"+me.uid
]=null;

}else{

updates[
"profiles/"+me.uid+
"/following/"+uid
]=true;

updates[
"profiles/"+uid+
"/followers/"+me.uid
]=true;

updates[
"notifications/"+uid+
"/"+me.uid
]={
type:"follow",
username:
profiles[me.uid]?.username||
"User",
createdAt:Date.now()
};

}

try{

await update(
ref(db),
updates
);

if(viewingProfileId){

otherProfile(uid);

}else{

render();

}

}catch(e){

alert(
"Follow नहीं हुआ: "+
e.message
);

}

};
