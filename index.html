/* =====================================================
   SIGNUP
===================================================== */

window.signup=async function(){

 const name=
 document.getElementById("name").value.trim();

 const username=
 document.getElementById("username")
 .value.trim()
 .toLowerCase()
 .replace(/\s/g,"");

 const email=
 document.getElementById("email").value.trim();

 const password=
 document.getElementById("password").value;

 const err=
 document.getElementById("err");

 if(!name||!username||!email||!password){

  err.textContent=
  "सभी details भरें";

  return;

 }

 if(password.length<6){

  err.textContent=
  "Password कम से कम 6 characters का होना चाहिए";

  return;

 }

 try{

  const all=
  await get(ref(db,"profiles"));

  const data=
  all.val()||{};

  const exists=
  Object.values(data).some(
   p=>
   String(p.username||"").toLowerCase()===
   username
  );

  if(exists){

   err.textContent=
   "यह username पहले से मौजूद है";

   return;

  }

  const result=
  await createUserWithEmailAndPassword(
   auth,
   email,
   password
  );

  const u=result.user;

  await updateProfile(u,{
   displayName:name
  });

  await set(
   ref(db,"profiles/"+u.uid),
   {
    uid:u.uid,
    name:name,
    username:username,
    email:email,
    phone:"",
    photo:"",
    bio:"",
    followers:{},
    following:{},
    createdAt:Date.now()
   }
  );

  err.innerHTML=
  '<div class="success">✅ Account बन गया</div>';

 }catch(e){

  console.error(e);

  err.textContent=
  "❌ "+(e.code||e.message);

 }

};

   Object.values(data).forEach(p=>{

    if(
     String(p.username||"")
     .toLowerCase()===

    ){

     found=p;

    }

   });

   if(!found){

    err.textContent=
    "Username नहीं मिला";

    return;

   }

   email=found.email;

  }

  await signInWithEmailAndPassword(
   auth,
   email,
   password
  );

 }catch(e){

  console.error(e);

  err.textContent=
  "❌ "+(e.code||e.message);

 }

};

window.sendOTP=async function(){

 const country=
 document.getElementById("countryCode")
 .value;

 .value.trim();

 number=
 number.replace(/\D/g,"");

 if(!number){

  alert("Phone number डालें");

  return;

 }

 number=
 number.replace(/^0+/,"");

 const phone=
 country+number;

 try{

  if(recaptchaVerifier){

   try{
    recaptchaVerifier.clear();
   }catch(e){}

   recaptchaVerifier=null;

  }

  recaptchaVerifier=
  new RecaptchaVerifier(
   auth,
   "recaptcha-container",
   {
    size:"normal"
   }
  );

  await recaptchaVerifier.render();

  phoneConfirmation=
  await signInWithPhoneNumber(
   auth,
   phone,
   recaptchaVerifier
  );

  document
  .getElementById("otpArea")
  .classList.remove("hidden");

  alert(
   "✅ OTP भेज दिया गया\n\n"+
   "Number: "+phone
  );

 }catch(e){

  console.error(e);

  alert(
   "❌ OTP नहीं भेजा गया:\n"+
   (e.code||e.message)
  );

  if(recaptchaVerifier){

   try{
    recaptchaVerifier.clear();
   }catch(x){}

   recaptchaVerifier=null;

  }

 }

};


/* =====================================================
   VERIFY OTP
===================================================== */

window.verifyOTP=async function(){

 const otp=
 document.getElementById("otp")
 .value.trim();

 const err=
 document.getElementById("err");

 if(!phoneConfirmation){

  err.textContent=
  "पहले Send OTP दबाएँ";

  return;

 }

 if(!/^\d{6}$/.test(otp)){

  err.textContent=
  "6 digit OTP डालें";

  return;

 }

 try{

  const result=
  await phoneConfirmation.confirm(otp);

  const u=result.user;

  const profileRef=
  ref(db,"profiles/"+u.uid);

  const snap=
  await get(profileRef);

  if(!snap.exists()){

   const username=
   "user"+String(u.uid).slice(0,7);

   await set(
    profileRef,
    {
     uid:u.uid,
     name:"Rechod User",
     username:username,
     email:u.email||"",
     phone:u.phoneNumber||"",
     photo:"",
     bio:"",
     followers:{},
     following:{},
     createdAt:Date.now()
    }
   );

  }

  phoneConfirmation=null;

  if(recaptchaVerifier){

   try{
    recaptchaVerifier.clear();
   }catch(e){}

   recaptchaVerifier=null;

  }

 }catch(e){

  console.error(e);

  if(
   e.code===
   "auth/invalid-verification-code"
  ){

   err.textContent=
   "❌ OTP गलत है";

  }else if(
   e.code===
   "auth/code-expired"
  ){

   err.textContent=
   "❌ OTP expire हो गया। नया OTP भेजें";

  }else{

   err.textContent=
   "❌ "+(e.code||e.message);

  }

 }

};

/* =====================================================
   POST CARD
===================================================== */

function postCard(id,p){

 const owner=
 profiles[p.uid]||{};

 let media="";


 if(
  Array.isArray(p.images)&&
  p.images.length
 ){

  if(p.images.length===1){

   media=`

   <img
    class="post-img"
    style="filter:${
     filters[p.filter]||"none"
    }"
    src="${p.images[0]}">

   `;

  }else{

   media=`

   <div class="multi-grid">

    ${
     p.images.map(x=>`

      <img
       style="filter:${
        filters[p.filter]||"none"
       }"
       src="${x}">

     `).join("")
    }

   </div>

   `;

  }

 }


 const likeCount=
 p.likes?
 Object.keys(p.likes).length:
 0;


 const liked=
 p.likes&&p.likes[me.uid];


 const commentCount=
 p.comments?
 Object.keys(p.comments).length:
 0;


 let commentsHTML="";


 if(p.comments){

  commentsHTML=
  Object.values(p.comments)
  .sort(
   (a,b)=>
   (a.createdAt||0)-
   (b.createdAt||0)
  )
  .slice(-3)
  .map(c=>{

   const cp=
   profiles[c.uid]||{};

   return`

   <div class="comment">

    <b>
     @${escapeHTML(
      cp.username||"user"
     )}
    </b>

    ${formatText(c.text)}

   </div>

   `;

  }).join("");

 }


 return`

 <div class="card">

  <div class="userline">

   <img
    class="avatar"
    src="${
     owner.photo||
     avatar(p.uid)
    }">

   <div style="flex:1">

    <div
     class="username"
     onclick="openProfile('${p.uid}')">

     ${escapeHTML(
      owner.username||
      owner.name||
      "user"
     )}

    </div>

    <div class="post-time">
     ${timeAgo(p.createdAt)}
    </div>

   </div>

   ${
    p.uid===me.uid
    ?
    `<button
      class="topbtn"
      onclick="deletePost('${id}')">
      ⋮
     </button>`
    :""
   }

  </div>


  ${media}


  ${
   p.caption
   ?
   `<p class="caption">
     ${formatText(p.caption)}
    </p>`
   :""
  }


  ${
   p.song
   ?
   `<audio
     controls
     src="${p.song}">
    </audio>`
   :""
  }


  <div class="actions">

   <button
    class="action"
    onclick="likePost('${id}')">

    ${liked?"❤️":"🤍"}
    ${likeCount}

   </button>


   <button
    class="action"
    onclick="openComments('${id}')">

    💬 ${commentCount}

   </button>


   <button
    class="action"
    onclick="sharePost('${id}')">

    ↗️ Share

   </button>

  </div>


  ${
   commentsHTML
   ?
   `<div>${commentsHTML}</div>`
   :""
  }

 </div>

 `;

}

/* =====================================================
   CLOUDINARY
===================================================== */

async function cloudinaryUpload(
 file,
 resourceType="auto"
){

 const fd=
 new FormData();

 fd.append(
  "file",
  file
 );

 fd.append(
  "upload_preset",
  UPLOAD_PRESET
 );


 const endpoint=
 `https://api.cloudinary.com/v1_1/`+
 `${CLOUD_NAME}/`+
 `${resourceType}/upload`;


 const res=
 await fetch(
  endpoint,
  {
   method:"POST",
   body:fd
  }
 );


 const data=
 await res.json();


 if(
  !res.ok||
  !data.secure_url
 ){

  throw new Error(
   data.error?.message||
   "Cloudinary upload failed"
  );

 }


 return data.secure_url;

}

window.uploadPost=async function(){

 if(!postFiles.length){

  alert(
   "Photo select करें"
  );

  return;

 }

 const caption=
 document.getElementById(
  "postCaption"
 ).value.trim();

 const songFile=
 document.getElementById(
  "postSong"
 ).files[0];


 try{

  alert(
   "Photo upload हो रही है..."
  );


  const urls=[];


  for(
   const file of postFiles
  ){

   const url=
   await cloudinaryUpload(
    file,
    "image"
   );

   urls.push(url);

  }


  let song="";


  if(songFile){

   song=
   await cloudinaryUpload(
    songFile,
    "video"
   );

  }


  const postRef=
  push(ref(db,"posts"));


  await set(
   postRef,
   {

    uid:me.uid,

    images:urls,

    caption:caption,

    filter:selectedFilter,

    song:song,

    likes:{},

    comments:{},

    createdAt:Date.now()

   }
  );


  await notifyMentions(
   caption,
   "post",
   postRef.key
  );


  postFiles=[];


  alert(
   "✅ Post uploaded"
  );


  page("home");


 }catch(e){

  console.error(e);

  alert(
   "❌ Upload Error:\n"+
   e.message
  );

 }

};

window.followUser=

 .sort()

       onclick="deleteStory('${id}')">
       🗑️
      </button>`
     :""
    }

   </div>

  </div>

 </div>

 `;


 set(
  ref(
   db,
   `stories/${id}/views/${me.uid}`
  ),
  true
 );

};


/* =====================================================
   STORY LIKE
===================================================== */

window.likeStory=
async function(id){

 const likeRef=
 ref(
  db,
  `stories/${id}/likes/${me.uid}`
 );


 await runTransaction(
  likeRef,
  value=>
  value?null:true
 );


 viewStory(id);

};


/* =====================================================
   DELETE STORY
===================================================== */

window.deleteStory=
async function(id){

 const s=
 stories[id];

 if(!s||s.uid!==me.uid)return;


 if(
  !confirm(
   "Story delete करना है?"
  )
 )return;


 await remove(
  ref(
   db,
   "stories/"+id
  )
 );


 page("home");

};


/* =====================================================
   MENTIONS
===================================================== */

async function notifyMentions(
 text,
 type,
 contentId
){

 if(!text)return;


 const matches=
 text.match(
  /@([a-zA-Z0-9_.]+)/g
 );


 if(!matches)return;


 const names=
 [...new Set(
  matches.map(
   x=>
   x.substring(1)
   .toLowerCase()
  )
 )];


 const snap=
 await get(
  ref(db,"profiles")
 );


 const data=
 snap.val()||{};


 for(
  const uid in data
 ){

  const p=data[uid];


  if(
   names.includes(
    String(
     p.username||""
    ).toLowerCase()
   )
  ){

   if(uid===me.uid)continue;


   await push(
    ref(
     db,
     `notifs/${uid}`
    ),
    {

     type:type,

     sender:me.uid,

     text:
     "ने आपको mention किया",

     contentId:
     contentId,

     createdAt:
     Date.now()

    }
   );

  }

 }

}

/* =====================================================

===================================================== */

function avatar(uid){

 const name=
 profiles[uid]?.name||
 profiles[uid]?.username||
 "User";


 return "https://ui-avatars.com/api/?name="+
 encodeURIComponent(name)+
 "&background=1877f2&color=fff";

}


function timeAgo(t){

 if(!t)return"";

 const sec=
 Math.floor(
  (Date.now()-t)/1000
 );


 if(sec<60)
  return"अभी";


 const min=
 Math.floor(sec/60);


 if(min<60)
  return min+" min";


 const hr=
 Math.floor(min/60);


 if(hr<24)
  return hr+" घंटे";


 const day=
 Math.floor(hr/24);


 return day+" दिन";

}


function escapeHTML(str){

 return String(str||"")
 .replace(
  /&/g,
  "&amp;"
 )
 .replace(
  /</g,
  "&lt;"
 )
 .replace(
  />/g,
  "&gt;"
 )
 .replace(
  /"/g,
  "&quot;"
 )
 .replace(
  /'/g,
  "&#039;"
 );

}


/* =====================================================
   FORMAT TEXT
===================================================== */

function formatText(text){

 let safe=
 escapeHTML(text);


 safe=
 safe.replace(
  /(@[a-zA-Z0-9_.]+)/g,
  '<span class="tag">$1</span>'
 );


 safe=
 safe.replace(
  /(#[_a-zA-Z0-9]+)/g,
  '<span class="tag">$1</span>'
 );


 safe=
 safe.replace(
  /\n/g,
  "<br>"
 );


 return safe;

}

setInterval(
 async()=>{

  if(!me)return;


  Object.entries(
   stories
  ).forEach(
   async([id,s])=>{

    if(
     s.createdAt &&
     Date.now()-s.createdAt>
     86400000

     try{

      await remove(
       ref(
        db,
        "stories/"+id
       )
      );

     }catch(e){}

    }

   }
  );

 },
 60000
);
