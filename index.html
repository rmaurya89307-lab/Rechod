const filters={

const filterNames={
 normal:"Normal",
 bright:"Bright",
 vivid:"Vivid",
 vintage:"Vintage",
 warm:"Warm",
 cool:"Cool",
 bw:"B&W",
 sunset:"Sunset",
 cinematic:"Cinematic",

};


/* =========================================================
   EDITOR
========================================================= */

function defaultEdit(){
 return {
   brightness:100,
   contrast:100,
   saturation:100,
   exposure:0,
   highlights:0,
   shadows:0,
   warmth:0,
   sharpness:0,
   fade:0,
   vignette:0
 };
}

function editCSS(e={}){
 const brightness=(Number(e.brightness??100)/100)+(Number(e.exposure??0)/200);
 const contrast=(Number(e.contrast??100)/100)+(Number(e.highlights??0)/500);
 const saturation=(Number(e.saturation??100)/100);
 const sepia=Math.max(0,Number(e.warmth??0)/200);
 const fade=Number(e.fade??0)/100;

 return `
 brightness(${Math.max(.2,brightness)})
 contrast(${Math.max(.2,contrast)})
 saturate(${Math.max(0,saturation)})
 sepia(${sepia})
 opacity(${Math.max(.4,1-fade*.3)})
 `;
}

function editorHTML(type){
 const e=
  type==="post"?postEdit:
  type==="story"?storyEdit:
  reelEdit;

 const selected=
  type==="post"?selectedFilter:
  type==="story"?selectedStoryFilter:
  selectedReelFilter;

 return `
 <div class="editor card">
   <div class="editor-title">🎨 Filter</div>

   <div class="filter-scroll">
    ${Object.keys(filters).map(k=>`
      <button class="filter-btn ${selected===k?"active":""}"
       onclick="selectFilter('${type}','${k}')">
       ${filterNames[k]}
      </button>
    `).join("")}
   </div>

   <div class="editor-title">⚙️ Manual Edit</div>

   ${rangeHTML(type,"brightness","Brightness",50,180,e.brightness,100)}
   ${rangeHTML(type,"contrast","Contrast",50,180,e.contrast,100)}
   ${rangeHTML(type,"saturation","Saturation",0,200,e.saturation,100)}
   ${rangeHTML(type,"exposure","Exposure",-100,100,e.exposure,0)}
   ${rangeHTML(type,"highlights","Highlights",-100,100,e.highlights,0)}
   ${rangeHTML(type,"shadows","Shadows",-100,100,e.shadows,0)}
   ${rangeHTML(type,"warmth","Warmth",-100,100,e.warmth,0)}
   ${rangeHTML(type,"sharpness","Sharpness",0,100,e.sharpness,0)}
   ${rangeHTML(type,"fade","Fade",0,100,e.fade,0)}
   ${rangeHTML(type,"vignette","Vignette",0,100,e.vignette,0)}

   <button class="btn secondary small" onclick="resetEditor('${type}')">
    Reset Edit
   </button>
 </div>
 `;
}

function rangeHTML(type,key,label,min,max,value,def){
 return `
 <div class="range">
  <label>${label}</label>
  <input type="range"
   min="${min}" max="${max}" value="${value}"
   oninput="changeEdit('${type}','${key}',this.value)">
  <output id="${type}_${key}">${value}</output>
 </div>
 `;
}

window.changeEdit=function(type,key,value){
 const target=
  type==="post"?postEdit:
  type==="story"?storyEdit:
  reelEdit;

 target[key]=Number(value);

 const out=document.getElementById(`${type}_${key}`);
 if(out)out.value=value;

 refreshCreatePreview();
};

window.resetEditor=function(type){
 if(type==="post")postEdit=defaultEdit();
 if(type==="story")storyEdit=defaultEdit();
 if(type==="reel")reelEdit=defaultEdit();

 refreshCreatePreview();
};

window.selectFilter=function(type,key){
 if(type==="post")selectedFilter=key;
 if(type==="story")selectedStoryFilter=key;
 if(type==="reel")selectedReelFilter=key;

 renderCreate();
};

   document.getElementById("loginEmail").value.trim(),
   document.getElementById("loginPassword").value

window.signup=async function(){
 try{
  const username=document.getElementById("signupName").value.trim();
  const email=document.getElementById("signupEmail").value.trim();
  const password=document.getElementById("signupPassword").value;

  if(!username||!email||!password){
   toast("Sabhi details bharen");
   return;
  }

  const cred=await createUserWithEmailAndPassword(auth,email,password);

  await updateProfile(cred.user,{
   displayName:username
  });

  await set(ref(db,"profiles/"+cred.user.uid),{
   uid:cred.user.uid,
   username,
   name:username,
   email,
   photo:"",
   bio:"",
   followers:{},
   following:{},
   createdAt:Date.now()
  });

 }catch(e){
  toast(e.message);
 }
};

let confirmationResult=null;
let recaptcha=null;

window.sendOTP=async function(){
 try{
  let phone=document.getElementById("phoneNumber").value.trim();

  phone=phone.replace(/[^\d+]/g,"");

  if(phone.startsWith("0"))phone="+91"+phone.substring(1);
  if(!phone.startsWith("+"))phone="+91"+phone;

  if(!/^\+[1-9]\d{7,14}$/.test(phone)){
   toast("Sahi international phone number dale");
   return;
  }

  if(recaptcha){
   try{recaptcha.clear()}catch(e){}
  }

  recaptcha=new RecaptchaVerifier(auth,"recaptcha-container",{
   size:"normal"
  });

  confirmationResult=await signInWithPhoneNumber(
   auth,
   phone,
   recaptcha
  );

  document.getElementById("otpBox").classList.remove("hidden");
  toast("OTP bhej diya gaya");
 }catch(e){
  toast(e.message);
 }
};

window.verifyOTP=async function(){
 try{
  const code=document.getElementById("otpCode").value.trim();

  if(!confirmationResult){
   toast("Pehle OTP bhejiye");
   return;
  }

  const result=await confirmationResult.confirm(code);
  const u=result.user;

  const snap=await get(ref(db,"profiles/"+u.uid));

  if(!snap.exists()){
   await set(ref(db,"profiles/"+u.uid),{
    uid:u.uid,
    username:"user_"+u.uid.slice(0,6),
    name:"Rechod User",
    email:u.phoneNumber||"",
    phone:u.phoneNumber||"",
    photo:"",
    bio:"",
    followers:{},
    following:{},
    createdAt:Date.now()
   });
  }

 }catch(e){
  toast(e.message);
 }
};

/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(s=""){
 return String(s)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function profile(uid){
 return profiles[uid]||{
  uid,
  username:"User",
  name:"User",
  photo:""
 };
}

function avatar(uid,cls="avatar"){
 const p=profile(uid);
 const src=p.photo||
 `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name||p.username||"U")}&background=1877f2&color=fff`;

 return `<img class="${cls}" src="${src}" onerror="this.src='https://ui-avatars.com/api/?name=U&background=1877f2&color=fff'">`;
}

function timeAgo(t){
 if(!t)return"";
 const sec=Math.floor((Date.now()-t)/1000);
 if(sec<60)return`${sec}s`;
 if(sec<3600)return`${Math.floor(sec/60)}m`;
 if(sec<86400)return`${Math.floor(sec/3600)}h`;
 if(sec<604800)return`${Math.floor(sec/86400)}d`;
 return new Date(t).toLocaleDateString();
}

function toast(msg){
 const el=document.getElementById("toast");
 el.textContent=msg;
 el.style.display="block";
 clearTimeout(window.__toast);
 window.__toast=setTimeout(()=>{
  el.style.display="none";
 },2500);
}

function count(obj){
 return obj?Object.keys(obj).length:0;
}

function isFollowing(uid){
 return !!profiles[me?.uid]?.following?.[uid];
}

function parseText(text=""){
 return escapeHTML(text)
  .replace(/(@[a-zA-Z0-9_]+)/g,
   '<span class="mention">$1</span>')
  .replace(/(#[a-zA-Z0-9_]+)/g,
   '<span class="hashtag">$1</span>');
}

function mediaStyle(filterName,edit){
 return `filter:${filters[filterName]||""} ${editCSS(edit)}`;
}

function menuClose(){
 document.getElementById("modalRoot").innerHTML="";
}

window.page=function(p){
 current=p;

 document.querySelectorAll(".nav-btn").forEach(b=>{
  b.classList.toggle("active",b.dataset.page===p);
 });

 render();
 window.scrollTo(0,0);
};

function render(){

 const el=document.getElementById("page");

 if(current==="home")el.innerHTML=homePage();
 else if(current==="profile")el.innerHTML=profilePage(me.uid);
 else if(current==="search")el.innerHTML=searchPage();
 else if(current==="create")renderCreate();
 else if(current==="reels")el.innerHTML=reelsPage();
 else if(current==="chat")el.innerHTML=chatPage();
 else if(current==="settings")el.innerHTML=settingsPage();
 else if(current==="notifications")el.innerHTML=notificationsPage();
 else if(current==="followers")el.innerHTML=userListPage("followers");
 else if(current==="following")el.innerHTML=userListPage("following");
 else el.innerHTML=homePage();

}

window.showProfileSection=function(type,uid){

 const box=document.getElementById("profileSection");
 if(!box)return;

 if(type==="reels"){
  const arr=Object.entries(reels).filter(([id,x])=>x.uid===uid);

  box.innerHTML=`
   <div class="grid">
    ${arr.map(([id,x])=>`
     <div class="grid-item video-cover" onclick="viewReel('${id}')">
      <video src="${x.video}" muted></video>
     </div>
    `).join("")}
   </div>
  `;
 }

 if(type==="tagged"){
  const arr=Object.entries(posts).filter(([id,x])=>
   String(x.tags||"").split(",").map(v=>v.trim()).includes(profile(uid).username)
  );

  box.innerHTML=`
   <div class="grid">
    ${arr.flatMap(([id,x])=>
     (x.media||[]).map(img=>`
      <div class="grid-item"><img src="${img}"></div>
     `)
    ).join("")}
   </div>
  `;
 }

 if(type==="highlights"){
  const arr=Object.entries(stories)
   .filter(([id,x])=>x.uid===uid&&x.highlight);

  box.innerHTML=`
   ${arr.length?
    `<div class="grid">
      ${arr.map(([id,x])=>`
       <div class="grid-item">
        ${x.type==="video"?
         `<video src="${x.media}" controls></video>`:
         `<img src="${x.media}">`
        }
       </div>
      `).join("")}
     </div>`:
    `<div class="empty">Highlights नहीं हैं</div>`
   }
  `;
 };

};

window.followUser=async function(uid){

 if(!me||uid===me.uid)return;

 const my=profile(me.uid);
 const other=profile(uid);

 await update(ref(db,"profiles/"+me.uid+"/following"),{
  [uid]:true
 });

 await update(ref(db,"profiles/"+uid+"/followers"),{
  [me.uid]:true
 });

 await push(ref(db,"notifs/"+uid),{
  type:"follow",
  senderUid:me.uid,
  text:`${my.username} started following you`,
  createdAt:Date.now()
 });

 toast("Following");
};

window.unfollowUser=async function(uid){

 await remove(ref(db,"profiles/"+me.uid+"/following/"+uid));
 await remove(ref(db,"profiles/"+uid+"/followers/"+me.uid));

 toast("Unfollowed");
};

function suggestionsHTML(){

function suggestionRow(p){

   ${avatar(p.uid,"avatar small")}

  }

window.doSearch=function(q){

 clearTimeout(searchTimer);

 searchTimer=setTimeout(()=>{

  q=q.trim().toLowerCase();

  if(!q){
   document.getElementById("searchResults").innerHTML=suggestionsHTML();
   return;
  }

  const users=Object.values(profiles).filter(p=>
   p.uid!==me.uid &&
   (
    String(p.username||"").toLowerCase().includes(q) ||
    String(p.name||"").toLowerCase().includes(q)
   )
  );

  document.getElementById("searchResults").innerHTML=`
   <div class="card">
    <b>Search Results</b>
    ${users.length?
     users.map(p=>suggestionRow(p)).join(""):
     `<div class="empty">User नहीं मिला</div>`
    }
   </div>
  `;

 },150);
};

/* =========================================================
   CLOUDINARY UPLOAD
========================================================= */

async function uploadCloudinary(file,type="auto"){

 if(!file)throw new Error("File missing");

 const form=new FormData();
 form.append("file",file);
 form.append("upload_preset",UPLOAD_PRESET);

 const resource=file.type.startsWith("image")?"image":
                file.type.startsWith("video")||file.type.startsWith("audio")?"video":
                "auto";

 const res=await fetch(
  `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resource}/upload`,
  {
   method:"POST",
   body:form
  }
 );

 const data=await res.json();

 if(!res.ok||!data.secure_url){
  throw new Error(data.error?.message||"Upload failed");
 }

 return data.secure_url;
}

window.getLocation=function(type){

 if(!navigator.geolocation){
  toast("Location supported नहीं है");
  return;
 }

 navigator.geolocation.getCurrentPosition(
  pos=>{
   const lat=pos.coords.latitude.toFixed(5);
   const lon=pos.coords.longitude.toFixed(5);

   const text=`${lat}, ${lon}`;

   if(type==="post"){
    postLocation=text;
    const el=document.getElementById("postLocation");
    if(el)el.value=text;
   }

   if(type==="story"){
    storyLocation=text;
    const el=document.getElementById("storyLocation");
    if(el)el.value=text;
   }

   if(type==="reel"){
    reelLocation=text;
    const el=document.getElementById("reelLocation");
    if(el)el.value=text;
   }

   toast("Current location added");
  },
  ()=>{
   toast("Location permission allow करें");
  },
  {
   enableHighAccuracy:true,
   timeout:10000
  }
 );
};

window.filterUserList=function(q,type){

 if(!box)return;

 const obj=
  type==="followers"?
  profiles[me.uid]?.followers||{}:
  profiles[me.uid]?.following||{};

 const ids=Object.keys(obj);

 const arr=ids
  .map(uid=>profile(uid))

/* =========================================================
   CHAT / DM
========================================================= */

function conversationId(a,b){
 return [a,b].sort().join("_");
}

function chatPage(){

 if(activeChatUid)return chatWindow(activeChatUid);

 const users=Object.values(profiles)
  .filter(p=>p.uid!==me.uid);

 return `
 <div class="card">
  <div class="between">
   <b>💬 Messages</b>
   <button class="btn small" onclick="newMessage()">+ New</button>
  </div>

  <input placeholder="Search messages/users..."
   oninput="searchChatUsers(this.value)"
   style="margin-top:8px">

  <div id="chatUsers" class="chat-list" style="margin-top:8px">
   ${users.map(p=>chatUserRow(p)).join("")}
  </div>
 </div>
 `;
}

function chatUserRow(p){

 const cid=conversationId(me.uid,p.uid);

 const list=messages[cid]?
  Object.values(messages[cid]).sort((a,b)=>b.timestamp-a.timestamp):[];

 const last=list[0];

 return `
 <div class="chat-user" onclick="openChat('${p.uid}')">
  ${avatar(p.uid,"avatar")}
  <div style="flex:1">
   <b>${escapeHTML(p.name||p.username)}</b>
   <div class="muted">
    ${last?escapeHTML(last.text||"Media"):"Start a conversation"}
   </div>
  </div>
  ${last?.seen===false&&last.receiverUid===me.uid?
   `<b style="color:#1877f2">●</b>`:""
  }
 </div>
 `;
}

window.searchChatUsers=function(q){

 const box=document.getElementById("chatUsers");
 if(!box)return;

 const users=Object.values(profiles).filter(p=>
  p.uid!==me.uid &&
  (
   String(p.username||"").toLowerCase().includes(q.toLowerCase())||
   String(p.name||"").toLowerCase().includes(q.toLowerCase())
  )
 );

 box.innerHTML=users.map(p=>chatUserRow(p)).join("");
};

function chatWindow(uid){

 const cid=conversationId(me.uid,uid);

 const arr=Object.values(messages[cid]||{})
  .sort((a,b)=>a.timestamp-b.timestamp);

 return `
 <div class="chat-window">

  <div class="card" style="margin-bottom:0">
   <div class="between">
    <div class="row">
     <button class="icon-btn" onclick="closeChat()">‹</button>
     ${avatar(uid,"avatar small")}
     <div>
      <b>${escapeHTML(p.name||p.username)}</b>
      <div class="muted">@${escapeHTML(p.username)}</div>
     </div>
    </div>

    <div class="row">
     <button class="icon-btn" onclick="startCall('${uid}','audio')">📞</button>
     <button class="icon-btn" onclick="startCall('${uid}','video')">📹</button>
     <button class="icon-btn" onclick="chatProfileMenu('${uid}')">⋮</button>
    </div>
   </div>
  </div>

  <div class="messages">
   ${arr.length?
    arr.map(m=>messageBubble(m,cid)).join(""):
    `<div class="empty">No messages yet</div>`
   }
  </div>

  <div class="chat-input">
   <input id="chatMessage" placeholder="Message..."
    onkeydown="if(event.key==='Enter')sendMessage('${uid}')">
   <button class="btn" onclick="sendMessage('${uid}')">Send</button>
  </div>
 </div>
 `;
}

function messageBubble(m,cid){

 const mine=m.senderUid===me.uid;

 if(!mine&&m.seen===false){
  update(ref(db,"messages/"+cid+"/"+m.id),{
   seen:true
  });
 }

 return `
 <div class="bubble ${mine?"me":"them"}">
  ${escapeHTML(m.text||"")}
  <div style="font-size:9px;opacity:.7;text-align:right">
   ${timeAgo(m.timestamp)} ${mine?(m.seen?"✓✓":"✓"):""}
  </div>
 </div>
 `;
}

window.sendMessage=async function(uid){

 const input=document.getElementById("chatMessage");
 if(!input)return;

 const text=input.value.trim();
 if(!text)return;

 const cid=conversationId(me.uid,uid);
 const key=push(ref(db,"messages/"+cid)).key;

 await set(ref(db,"messages/"+cid+"/"+key),{
  id:key,
  senderUid:me.uid,
  receiverUid:uid,
  text,
  timestamp:Date.now(),
  seen:false
 });

 await push(ref(db,"notifs/"+uid),{
  type:"message",
  senderUid:me.uid,
  text:"sent you a message",
  createdAt:Date.now()
 });

 input.value="";
};

/* =========================================================
   CALL SYSTEM - AUDIO + VIDEO
========================================================= */

const rtcConfig={
 iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"}
 ]
};

async function prepareCallMedia(type){

 const constraints={
  audio:true,
  video:type==="video"
 };

 localStream=await navigator.mediaDevices.getUserMedia(constraints);

 document.getElementById("localVideo").srcObject=localStream;

 if(type==="audio"){
  document.getElementById("localVideo").style.display="none";
 }else{
  document.getElementById("localVideo").style.display="block";
 }
}

function callUI(name,type){

 document.getElementById("callName").textContent=name;
 document.getElementById("callStatus").textContent=
  type==="video"?"Video calling...":"Audio calling...";

 document.getElementById("callScreen").classList.remove("hidden");
}

window.startCall=async function(uid,type="video"){

 if(!me||uid===me.uid)return;

 try{

  currentCallType=type;
  currentCallOtherUid=uid;
  isCaller=true;

  await prepareCallMedia(type);

  pc=new RTCPeerConnection(rtcConfig);

  localStream.getTracks().forEach(track=>{
   pc.addTrack(track,localStream);
  });

  remoteStream=new MediaStream();
  document.getElementById("remoteVideo").srcObject=remoteStream;

  pc.ontrack=e=>{
   e.streams[0].getTracks().forEach(track=>{
    remoteStream.addTrack(track);
   });
  };

  const callId=push(ref(db,"calls")).key;
  currentCallId=callId;

  pc.onicecandidate=e=>{
   if(!e.candidate)return;

   const candidate={
    ...e.candidate.toJSON(),
    from:me.uid
   };

   push(ref(db,
    `calls/${callId}/callerCandidates`
   ),candidate);
  };

  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);

  await set(ref(db,"calls/"+callId),{
   callerUid:me.uid,
   receiverUid:uid,
   callerName:profile(me.uid).name||profile(me.uid).username,
   type,
   status:"ringing",
   offer:{
    type:offer.type,
    sdp:offer.sdp
   },
   createdAt:Date.now()
  });

  await set(ref(db,
   `incomingCalls/${uid}/${callId}`
  ),{
   callId,
   callerUid:me.uid,
   callerName:profile(me.uid).name||profile(me.uid).username,
   type,
   createdAt:Date.now()
  });

  callUI(profile(uid).name||profile(uid).username,type);

  onValue(
   ref(db,`calls/${callId}/answer`),
   async snap=>{
    const answer=snap.val();

    if(answer&&pc&&pc.signalingState!=="stable"){
     try{
      await pc.setRemoteDescription(answer);
      document.getElementById("callStatus").textContent="Connected";
     }catch(e){}
    }
   },
   {onlyOnce:false}
  );

  onChildAdded(
   ref(db,`calls/${callId}/calleeCandidates`),
   async snap=>{
    try{
     if(pc&&snap.val()){
      await pc.addIceCandidate(
       new RTCIceCandidate(snap.val())
      );
     }
    }catch(e){}
   }
  );

 }catch(e){
  toast("Call error: "+e.message);
  cleanupCall(false);
 }
};


/* Incoming call listener */

function startIncomingCallListener(){

 onChildAdded(
  ref(db,`incomingCalls/${me.uid}`),
  snap=>{
   const data=snap.val();

   if(!data)return;
   if(data.callId===currentCallId)return;

   incomingCallData=data;
   showIncomingCall(data);
  }
 );
}

function showIncomingCall(data){

 const type=data.type==="video"?"Video":"Audio";

 document.getElementById("incomingRoot").innerHTML=`
 <div class="incoming">
  <div class="between">
   <div>
    <b>${escapeHTML(data.callerName||"Rechod User")}</b>
    <div class="muted" style="color:#aaa">${type} call incoming...</div>
   </div>
   <div style="font-size:28px">${type==="Video"?"📹":"📞"}</div>
  </div>

  <div class="row" style="margin-top:10px">
   <button class="btn success" style="flex:1"
    onclick="acceptCall()">
    Accept
   </button>

   <button class="btn danger" style="flex:1"
    onclick="rejectCall()">
    Reject
   </button>
  </div>
 </div>
 `;
}

window.acceptCall=async function(){

 const data=incomingCallData;

 if(!data)return;

 try{

  currentCallId=data.callId;
  currentCallOtherUid=data.callerUid;
  currentCallType=data.type;
  isCaller=false;

  document.getElementById("incomingRoot").innerHTML="";

  await prepareCallMedia(data.type);

  pc=new RTCPeerConnection(rtcConfig);

  localStream.getTracks().forEach(track=>{
   pc.addTrack(track,localStream);
  });

  remoteStream=new MediaStream();
  document.getElementById("remoteVideo").srcObject=remoteStream;

  pc.ontrack=e=>{
   e.streams[0].getTracks().forEach(track=>{
    remoteStream.addTrack(track);
   });
  };

  pc.onicecandidate=e=>{
   if(!e.candidate)return;

   push(
    ref(db,`calls/${data.callId}/calleeCandidates`),
    {
     ...e.candidate.toJSON(),
     from:me.uid
    }
   );
  };

  const callSnap=await get(
   ref(db,`calls/${data.callId}`)
  );

  const call=callSnap.val();

  if(!call?.offer){
   toast("Call offer नहीं मिला");
   cleanupCall(false);
   return;
  }

  await pc.setRemoteDescription(call.offer);

  const answer=await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await set(
   ref(db,`calls/${data.callId}/answer`),
   {
    type:answer.type,
    sdp:answer.sdp
   }
  );

  await update(
   ref(db,`calls/${data.callId}`),
   {
    status:"accepted"
   }
  );

  await remove(
   ref(db,`incomingCalls/${me.uid}/${data.callId}`)
  );

  onChildAdded(
   ref(db,`calls/${data.callId}/callerCandidates`),
   async snap=>{
    try{
     if(pc&&snap.val()){
      await pc.addIceCandidate(
       new RTCIceCandidate(snap.val())
      );
     }
    }catch(e){}
   }
  );

  callUI(data.callerName,data.type);

  document.getElementById("callStatus").textContent="Connected";

 }catch(e){
  toast("Accept call error: "+e.message);
  cleanupCall(false);
 }
};

window.rejectCall=async function(){

 const data=incomingCallData;

 if(data){
  await update(
   ref(db,`calls/${data.callId}`),
   {
    status:"rejected"
   }
  );

  await remove(
   ref(db,`incomingCalls/${me.uid}/${data.callId}`)
  );
 }

 document.getElementById("incomingRoot").innerHTML="";
 incomingCallData=null;
};

 track.enabled=!track.enabled;

window.hangupCall=async function(){

 if(currentCallId){
  try{
   await update(
    ref(db,`calls/${currentCallId}`),
    {
     status:"ended",
     endedAt:Date.now()
    }
   );

   if(!isCaller){
    await remove(
     ref(db,`incomingCalls/${me.uid}/${currentCallId}`)
    );
   }
  }catch(e){}
 }

 cleanupCall(true);
};

function cleanupCall(close=true){

 if(pc){
  try{pc.close()}catch(e){}
 }

 if(localStream){
  localStream.getTracks().forEach(t=>{
   try{t.stop()}catch(e){}
  });
 }

 localStream=null;
 remoteStream=null;
 pc=null;

 if(close){
  document.getElementById("callScreen").classList.add("hidden");
 }

 currentCallId=null;
 currentCallOtherUid=null;
 incomingCallData=null;

 document.getElementById("remoteVideo").srcObject=null;
 document.getElementById("localVideo").srcObject=null;
}


/* =========================================================
   CALL CLEANUP LISTENER
========================================================= */

onAuthStateChanged(auth,user=>{
 if(!user)return;

 onValue(ref(db,"calls"),snap=>{

  if(!currentCallId)return;

  const data=snap.val()?.[currentCallId];

  if(!data)return;

  if(data.status==="ended"||data.status==="rejected"){
   cleanupCall(true);
  }
 });
});
